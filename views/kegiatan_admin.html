<!-- views/kegiatan_admin.html -->
<!-- Halaman Admin: Manajemen Kegiatan (Logbook) -->
<!-- Logic: js/kegiatan_admin.js | Route: /kegiatan_admin | Libs: quill -->
<!-- Versi: 2.0.0 — CSS common sudah di css/style.css -->

<div id="main-content">
    <!-- ============================================================ -->
    <!-- HEADER                                                        -->
    <!-- ============================================================ -->
    <div class="flex flex-wrap justify-between items-center mb-6 gap-4">
        <h1 class="text-3xl font-bold text-[var(--text-main)] font-amiri">
            <i class="fas fa-calendar-check mr-2"></i>
            Manajemen Kegiatan (Logbook)
        </h1>
        <div class="flex flex-wrap gap-2">
            <button id="refresh-kegiatan-btn"
                    class="btn-secondary px-4 py-2 rounded-lg flex items-center gap-2">
                <i class="fas fa-sync-alt"></i>
                <span class="hidden sm:inline">Refresh</span>
            </button>
            <button id="add-kegiatan-btn"
                    class="btn-primary px-4 py-2 rounded-lg flex items-center gap-2">
                <i class="fas fa-plus"></i>
                <span>Tambah Kegiatan</span>
            </button>
            <button id="mobile-menu-btn"
                    class="md:hidden text-2xl text-[var(--text-muted)]"
                    aria-label="Buka Menu">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- TABEL KEGIATAN                                                -->
    <!-- ============================================================ -->
    <div class="table-wrapper">
        <div class="overflow-x-auto">
            <table class="w-full">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama Kegiatan</th>
                        <th>Tanggal</th>
                        <th>Tempat</th>
                        <th>Peserta</th>
                        <th>Anggaran</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="kegiatan-table-body" class="divide-y divide-[var(--card-border)]">
                    <!-- SKELETON LOADING -->
                    <tr id="kegiatan-skeleton">
                        <td colspan="7" class="text-center py-8">
                            <i class="fas fa-spinner fa-spin text-2xl text-[var(--text-muted)]"></i>
                            <p class="text-[var(--text-muted)] text-sm mt-2">Memuat data kegiatan...</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- ============================================================ -->
<!-- MODAL: TAMBAH / EDIT KEGIATAN                                 -->
<!-- ============================================================ -->
<div id="kegiatan-modal"
     class="fixed inset-0 bg-black/50 hidden items-center justify-center z-[9999] backdrop-blur-sm p-4">
    <div id="modal-content"
         class="bg-[var(--card-bg)] rounded-2xl shadow-2xl max-w-2xl w-full p-6 transform scale-95 opacity-0 transition-all duration-300 max-h-[90vh] overflow-y-auto">

        <h2 id="modal-title"
            class="text-2xl font-bold mb-4 text-[var(--text-main)] font-amiri">
            Tambah Kegiatan
        </h2>

        <form id="kegiatan-form" class="space-y-4">
            <input type="hidden" id="kegiatan-id">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                        Nama Kegiatan <span class="text-red-500">*</span>
                    </label>
                    <input type="text" id="kegiatan_nama"
                           class="form-input"
                           placeholder="Contoh: Pengajian Rutin"
                           required>
                </div>

                <div>
                    <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                        Tempat <span class="text-red-500">*</span>
                    </label>
                    <input type="text" id="kegiatan_tempat"
                           class="form-input"
                           placeholder="Contoh: Masjid Baitul Hadi"
                           required>
                </div>

                <div>
                    <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                        Tanggal Mulai <span class="text-red-500">*</span>
                    </label>
                    <input type="date" id="kegiatan_tanggal_mulai"
                           class="form-input"
                           required>
                </div>

                <div>
                    <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                        Tanggal Selesai <span class="text-red-500">*</span>
                    </label>
                    <input type="date" id="kegiatan_tanggal_selesai"
                           class="form-input"
                           required>
                </div>

                <div>
                    <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                        Peserta (jumlah) <span class="text-red-500">*</span>
                    </label>
                    <input type="number" id="kegiatan_peserta"
                           class="form-input"
                           placeholder="0"
                           min="0"
                           required>
                </div>

                <div>
                    <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                        Anggaran (Rp) <span class="text-red-500">*</span>
                    </label>
                    <input type="number" id="kegiatan_anggaran"
                           class="form-input"
                           placeholder="0"
                           min="0"
                           required>
                </div>
            </div>

            <div>
                <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                    Deskripsi Kegiatan <span class="text-red-500">*</span>
                </label>
                <!-- Quill Editor Container -->
                <div id="kegiatan_deskripsi_editor" class="kegiatan-quill-editor"></div>
                <!-- Hidden input untuk simpan value -->
                <input type="hidden" id="kegiatan_deskripsi" name="kegiatan_deskripsi">
            </div>

            <div>
                <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                    File Pendukung (URL)
                </label>
                <input type="text" id="kegiatan_file_url"
                       class="form-input"
                       placeholder="Link Google Drive (opsional)">
            </div>

            <div>
                <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                    Upload File Pendukung
                </label>
                <input type="file" id="kegiatan_file"
                       class="form-input"
                       accept="image/*,.pdf,.doc,.docx,.xls,.xlsx">
                <p class="text-xs text-[var(--text-muted)] mt-1">
                    <i class="fas fa-info-circle mr-1"></i>
                    File akan diunggah ke Google Drive dan URL otomatis terisi.
                </p>
            </div>

            <div class="flex justify-end gap-2 pt-2">
                <button type="button" id="modal-close"
                        class="btn-secondary px-4 py-2 rounded-lg">
                    Batal
                </button>
                <button type="submit"
                        class="btn-primary px-4 py-2 rounded-lg">
                    <i class="fas fa-save mr-2"></i>
                    <span>Simpan</span>
                </button>
            </div>
        </form>
    </div>
</div>

<!-- ============================================================ -->
<!-- SCRIPT INLINE — Konfirmasi saja (no emoji)                    -->
<!-- ============================================================ -->
<script>
    (function() {
        console.log('[View] kegiatan_admin.html loaded — logic handled by js/kegiatan_admin.js');
    })();
</script>

<!-- ============================================================ -->
<!-- STYLE INLINE — Khusus view kegiatan_admin saja                -->
<!-- Common styles (btn-primary, btn-secondary, form-input, table) -->
<!-- sudah di-load dari css/style.css                              -->
<!-- ============================================================ -->
<style>
    /* ────────────── QUILL EDITOR OVERRIDE ────────────── */
    .kegiatan-quill-editor {
        height: 200px;
        background: var(--bg-input);
        border-radius: 0 0 0.5rem 0.5rem;
    }

    /* Quill toolbar */
    .kegiatan-quill-editor + .ql-toolbar,
    .ql-toolbar.ql-snow {
        border-radius: 0.5rem 0.5rem 0 0;
        border-color: var(--card-border);
        background: var(--bg-input);
        font-family: 'Inter', sans-serif;
    }
    .ql-toolbar.ql-snow + .ql-container.ql-snow,
    .ql-container.ql-snow {
        border-radius: 0 0 0.5rem 0.5rem;
        border-color: var(--card-border);
        background: var(--bg-input);
        font-family: 'Inter', sans-serif;
        font-size: 0.95rem;
    }
    .ql-editor {
        min-height: 200px;
        color: var(--text-main);
        line-height: 1.6;
    }
    .ql-editor.ql-blank::before {
        color: var(--text-muted);
        font-style: normal;
    }

    /* Dark mode Quill */
    .dark .ql-toolbar.ql-snow,
    .dark .ql-container.ql-snow {
        background: #1e293b;
        border-color: #334155;
    }
    .dark .ql-editor { color: #e2e8f0; }
    .dark .ql-editor.ql-blank::before { color: #64748b; }
    .dark .ql-snow .ql-stroke { stroke: #cbd5e1; }
    .dark .ql-snow .ql-fill { fill: #cbd5e1; }
    .dark .ql-snow .ql-picker { color: #cbd5e1; }
    .dark .ql-snow .ql-picker-options {
        background: #1e293b;
        border-color: #334155;
    }

    /* ────────────── RESPONSIVE ────────────── */
    @media (max-width: 640px) {
        #modal-content {
            padding: 1rem;
        }
        .kegiatan-quill-editor {
            height: 160px;
        }
    }
</style>
