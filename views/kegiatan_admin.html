<!-- views/kegiatan_admin.html -->
<!-- Fragment Manajemen Kegiatan (Logbook) untuk Admin -->
<!-- Versi: 4.1.0 - Final Fix (Stable, No Loop, Sinkron dengan Backend) -->

<!-- Konten Utama -->
<div id="main-content">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold text-[var(--text-main)] font-amiri">Manajemen Kegiatan (Logbook)</h1>
        <div class="flex gap-2">
            <button id="refresh-kegiatan-btn" class="btn-secondary px-4 py-2 rounded-lg transition shadow-md flex items-center gap-2">
                <i class="fas fa-sync-alt"></i> Refresh
            </button>
            <button id="add-kegiatan-btn" class="btn-primary px-4 py-2 rounded-lg transition shadow-md flex items-center gap-2">
                <i class="fas fa-plus mr-2"></i>Tambah Kegiatan
            </button>
            <button id="mobile-menu-btn" class="md:hidden text-2xl text-[var(--text-muted)]">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </div>

    <!-- Tabel Kegiatan -->
    <div class="bg-[var(--card-bg)] backdrop-blur-sm rounded-2xl shadow-lg border border-[var(--card-border)] overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full">
                <thead class="bg-[var(--bg-stats)]">
                    <tr>
                        <th class="px-6 py-4 text-left text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider">No</th>
                        <th class="px-6 py-4 text-left text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider">Nama Kegiatan</th>
                        <th class="px-6 py-4 text-left text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider">Tanggal</th>
                        <th class="px-6 py-4 text-left text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider">Tempat</th>
                        <th class="px-6 py-4 text-left text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider">Peserta</th>
                        <th class="px-6 py-4 text-left text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider">Anggaran</th>
                        <th class="px-6 py-4 text-left text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider">Aksi</th>
                    </tr>
                </thead>
                <tbody id="kegiatan-table-body" class="divide-y divide-[var(--card-border)]">
                    <!-- Skeleton Loading -->
                    <tr id="kegiatan-skeleton">
                        <td colspan="7" class="text-center py-8">
                            <div class="skeleton-box h-8 w-3/4 mx-auto mb-2"></div>
                            <div class="skeleton-box h-8 w-1/2 mx-auto"></div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- MODAL TAMBAH / EDIT KEGIATAN -->
<div id="kegiatan-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 backdrop-blur-sm">
    <div class="bg-[var(--card-bg)] rounded-2xl shadow-2xl max-w-2xl w-full p-6 transform scale-95 opacity-0 transition-all duration-300" id="modal-content">
        <h2 class="text-2xl font-bold mb-4 text-[var(--text-main)] font-amiri" id="modal-title">Tambah Kegiatan</h2>
        <form id="kegiatan-form">
            <input type="hidden" id="kegiatan-id">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="mb-4">
                    <label class="block text-[var(--text-muted)] mb-2">Nama Kegiatan</label>
                    <input type="text" id="kegiatan_nama" class="w-full px-4 py-2 border border-[var(--card-border)] rounded-lg focus:outline-none focus:border-[var(--text-main)] bg-[var(--bg-body)] text-[var(--text-main)]" required>
                </div>
                <div class="mb-4">
                    <label class="block text-[var(--text-muted)] mb-2">Tempat</label>
                    <input type="text" id="kegiatan_tempat" class="w-full px-4 py-2 border border-[var(--card-border)] rounded-lg focus:outline-none focus:border-[var(--text-main)] bg-[var(--bg-body)] text-[var(--text-main)]" required>
                </div>
                <div class="mb-4">
                    <label class="block text-[var(--text-muted)] mb-2">Tanggal Mulai</label>
                    <input type="date" id="kegiatan_tanggal_mulai" class="w-full px-4 py-2 border border-[var(--card-border)] rounded-lg focus:outline-none focus:border-[var(--text-main)] bg-[var(--bg-body)] text-[var(--text-main)]" required>
                </div>
                <div class="mb-4">
                    <label class="block text-[var(--text-muted)] mb-2">Tanggal Selesai</label>
                    <input type="date" id="kegiatan_tanggal_selesai" class="w-full px-4 py-2 border border-[var(--card-border)] rounded-lg focus:outline-none focus:border-[var(--text-main)] bg-[var(--bg-body)] text-[var(--text-main)]" required>
                </div>
                <div class="mb-4">
                    <label class="block text-[var(--text-muted)] mb-2">Peserta (jumlah)</label>
                    <input type="number" id="kegiatan_peserta" class="w-full px-4 py-2 border border-[var(--card-border)] rounded-lg focus:outline-none focus:border-[var(--text-main)] bg-[var(--bg-body)] text-[var(--text-main)]" required>
                </div>
                <div class="mb-4">
                    <label class="block text-[var(--text-muted)] mb-2">Anggaran (Rp)</label>
                    <input type="number" id="kegiatan_anggaran" class="w-full px-4 py-2 border border-[var(--card-border)] rounded-lg focus:outline-none focus:border-[var(--text-main)] bg-[var(--bg-body)] text-[var(--text-main)]" required>
                </div>
            </div>
            <div class="mb-4">
                <label class="block text-[var(--text-muted)] mb-2">Deskripsi Kegiatan</label>
                <div id="kegiatan_deskripsi_editor" style="height: 200px;"></div>
                <input type="hidden" id="kegiatan_deskripsi" name="kegiatan_deskripsi">
            </div>
            <div class="mb-4">
                <label class="block text-[var(--text-muted)] mb-2">File Pendukung (URL)</label>
                <input type="text" id="kegiatan_file_url" class="w-full px-4 py-2 border border-[var(--card-border)] rounded-lg focus:outline-none focus:border-[var(--text-main)] bg-[var(--bg-body)] text-[var(--text-main)]" placeholder="Link Google Drive (opsional)">
            </div>
            <div class="mb-4">
                <label class="block text-[var(--text-muted)] mb-2">Upload File Pendukung (gambar/dokumen)</label>
                <input type="file" id="kegiatan_file" class="w-full px-4 py-2 border border-[var(--card-border)] rounded-lg focus:outline-none focus:border-[var(--text-main)] bg-[var(--bg-body)] text-[var(--text-main)]">
                <p class="text-xs text-[var(--text-muted)] mt-1">File akan diunggah ke Google Drive dan URL otomatis terisi.</p>
            </div>
            <div class="flex justify-end gap-2">
                <button type="button" id="modal-close" class="px-4 py-2 bg-gray-300 rounded-lg hover:bg-gray-400 text-[var(--text-main)]">Batal</button>
                <button type="submit" class="px-4 py-2 btn-primary rounded-lg hover:bg-[var(--text-main)]">Simpan</button>
            </div>
        </form>
    </div>
</div>

<!-- STYLE INLINE (bisa digabung ke CSS global) -->
<style>
    /* Skeleton */
    .skeleton-box {
        background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
        background-size: 200% 100%;
        animation: shimmer 1.8s infinite;
        border-radius: 0.75rem;
    }
    .dark .skeleton-box {
        background: linear-gradient(90deg, #2d3748 25%, #4a5568 50%, #2d3748 75%);
    }
    @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
    }
    /* Tombol secondary (untuk refresh) */
    .btn-secondary {
        background: #f1f5f9;
        color: #1e293b;
        border: 1px solid #e2e8f0;
        border-radius: 0.5rem;
        padding: 0.5rem 1rem;
        font-weight: 500;
        transition: all 0.3s;
    }
    .btn-secondary:hover {
        background: #e2e8f0;
        transform: translateY(-2px);
    }
    .dark .btn-secondary {
        background: rgba(255,255,255,0.05);
        color: #c4b5e0;
        border: 1px solid rgba(128,90,213,0.4);
    }
    .dark .btn-secondary:hover {
        background: rgba(128,90,213,0.2);
        border-color: #a78bfa;
    }
    /* Quill Editor override */
    .ql-toolbar.ql-snow {
        border-radius: 0.5rem 0.5rem 0 0;
        border-color: var(--card-border);
        background: var(--bg-body);
    }
    .ql-container.ql-snow {
        border-radius: 0 0 0.5rem 0.5rem;
        border-color: var(--card-border);
        background: var(--bg-body);
    }
    .ql-editor {
        min-height: 200px;
        color: var(--text-main);
    }
    .ql-editor.ql-blank::before {
        color: var(--text-muted);
    }
</style>
