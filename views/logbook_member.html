<!-- views/logbook_member.html -->
<!-- Halaman Member: Logbook Kegiatan Pribadi -->
<!-- Logic: js/logbook_member.js | Route: /logbook_member | Libs: html2canvas, jspdf, docx -->
<!-- Versi: 2.0.0 — CSS common sudah di css/style.css -->

<div id="member-frame-content">
    <!-- ============================================================ -->
    <!-- HEADER                                                        -->
    <!-- ============================================================ -->
    <div class="flex flex-wrap justify-between items-center mb-6 gap-4">
        <h1 class="text-3xl font-bold text-[var(--text-main)] font-amiri">
            <i class="fas fa-book mr-2"></i>
            Logbook Kegiatan
        </h1>
        <div class="flex flex-wrap gap-2">
            <button id="refresh-logbook-btn"
                    class="btn-secondary px-4 py-2 rounded-lg flex items-center gap-2">
                <i class="fas fa-sync-alt"></i>
                <span class="hidden sm:inline">Refresh</span>
            </button>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- FORM BUAT LOGBOOK                                             -->
    <!-- ============================================================ -->
    <div class="logbook-card mb-8">
        <h2 class="text-xl font-bold text-[var(--text-main)] mb-4 font-amiri">
            <i class="fas fa-plus-circle mr-2 text-[var(--accent-500)]"></i>
            Buat Logbook Baru
        </h2>

        <form id="logbook-form" class="space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="form-label">
                        Nama Kegiatan <span class="text-red-500">*</span>
                    </label>
                    <input type="text" id="kegiatan"
                           class="form-input"
                           placeholder="Contoh: Rapat Koordinasi"
                           required>
                </div>
                <div>
                    <label class="form-label">
                        Tempat <span class="text-red-500">*</span>
                    </label>
                    <input type="text" id="tempat"
                           class="form-input"
                           placeholder="Contoh: Sekretariat PAC"
                           required>
                </div>
                <div>
                    <label class="form-label">
                        Tanggal Mulai <span class="text-red-500">*</span>
                    </label>
                    <input type="date" id="tanggal_mulai"
                           class="form-input"
                           required>
                </div>
                <div>
                    <label class="form-label">
                        Tanggal Selesai <span class="text-red-500">*</span>
                    </label>
                    <input type="date" id="tanggal_selesai"
                           class="form-input"
                           required>
                </div>
                <div>
                    <label class="form-label">
                        Peserta (jumlah) <span class="text-red-500">*</span>
                    </label>
                    <input type="number" id="peserta"
                           class="form-input"
                           placeholder="0"
                           min="0"
                           required>
                </div>
                <div>
                    <label class="form-label">
                        Anggaran (Rp) <span class="text-red-500">*</span>
                    </label>
                    <input type="number" id="anggaran"
                           class="form-input"
                           placeholder="0"
                           min="0"
                           required>
                </div>
            </div>

            <div>
                <label class="form-label">
                    Deskripsi Kegiatan <span class="text-red-500">*</span>
                </label>
                <textarea id="deskripsi" rows="4"
                          class="form-input"
                          placeholder="Tulis deskripsi kegiatan secara lengkap..."
                          required></textarea>
            </div>

            <div>
                <label class="form-label">
                    File Pendukung (URL)
                </label>
                <input type="text" id="file_url"
                       class="form-input"
                       placeholder="Link Google Drive (opsional)">
            </div>

            <div>
                <label class="form-label">
                    Upload File Pendukung
                </label>
                <input type="file" id="logbook_file"
                       class="form-input"
                       accept="image/*,.pdf,.doc,.docx">
                <p class="text-xs text-[var(--text-muted)] mt-1">
                    <i class="fas fa-info-circle mr-1"></i>
                    File akan diunggah ke Google Drive.
                </p>
            </div>

            <div class="flex flex-wrap gap-2 pt-2">
                <button type="submit"
                        class="btn-primary px-6 py-2 rounded-lg flex items-center gap-2">
                    <i class="fas fa-save"></i>
                    <span>Simpan Logbook</span>
                </button>
                <button type="button" id="preview-btn"
                        class="btn-secondary px-6 py-2 rounded-lg flex items-center gap-2">
                    <i class="fas fa-eye"></i>
                    <span>Preview</span>
                </button>
                <button type="button" id="export-pdf-btn"
                        class="btn-danger px-6 py-2 rounded-lg flex items-center gap-2">
                    <i class="fas fa-file-pdf"></i>
                    <span>Export PDF</span>
                </button>
                <button type="button" id="export-docx-btn"
                        class="btn-primary bg-blue-800 hover:bg-blue-900 px-6 py-2 rounded-lg flex items-center gap-2">
                    <i class="fas fa-file-word"></i>
                    <span>Export DOCX</span>
                </button>
            </div>
        </form>
    </div>

    <!-- ============================================================ -->
    <!-- PREVIEW                                                       -->
    <!-- ============================================================ -->
    <div id="logbook-preview" class="logbook-card mb-8 hidden">
        <h2 class="text-xl font-bold text-[var(--text-main)] mb-4 font-amiri">
            <i class="fas fa-eye mr-2 text-[var(--accent-500)]"></i>
            Preview Logbook
        </h2>
        <div id="logbook-preview-content"
             class="border border-[var(--card-border)] p-4 rounded-lg text-[var(--text-main)]">
            <!-- Konten di-render oleh js/logbook_member.js -->
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- DAFTAR LOGBOOK SAYA                                           -->
    <!-- ============================================================ -->
    <div class="logbook-card">
        <h2 class="text-xl font-bold text-[var(--text-main)] mb-4 font-amiri">
            <i class="fas fa-list mr-2 text-[var(--accent-500)]"></i>
            Daftar Logbook Saya
        </h2>

        <!-- SKELETON LOADING -->
        <div id="skeleton-logbook" class="space-y-4">
            <div class="skeleton-box h-20 w-full rounded-xl"></div>
            <div class="skeleton-box h-20 w-full rounded-xl"></div>
            <div class="skeleton-box h-20 w-full rounded-xl"></div>
        </div>

        <!-- KONTEN ASLI (di-render oleh JS) -->
        <div id="logbook-list" class="hidden space-y-4">
            <p class="text-[var(--text-muted)] text-center py-4">
                <i class="fas fa-spinner fa-spin mr-2"></i>Memuat data...
            </p>
        </div>
    </div>
</div>

<!-- ============================================================ -->
<!-- SCRIPT INLINE — Konfirmasi saja (no emoji)                    -->
<!-- ============================================================ -->
<script>
    (function() {
        console.log('[View] logbook_member.html loaded — logic handled by js/logbook_member.js');
    })();
</script>

<!-- ============================================================ -->
<!-- STYLE INLINE — Khusus view logbook_member saja                -->
<!-- Common styles (btn-primary, btn-secondary, btn-danger,        -->
<!-- form-input, form-label, skeleton-box) sudah di css/style.css  -->
<!-- ============================================================ -->
<style>
    /* ────────────── LOGBOOK CARD ────────────── */
    .logbook-card {
        background: var(--card-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--card-border);
        border-radius: 1rem;
        padding: 1.5rem;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        transition: box-shadow 280ms var(--ease-smooth);
    }
    .logbook-card:hover {
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    }

    /* ────────────── PREVIEW AREA ────────────── */
    #logbook-preview-content {
        background: var(--bg-body);
        padding: 1.5rem;
        border-radius: 0.5rem;
        color: var(--text-main);
    }

    /* ────────────── PREVIEW TABLE (logbook-doc) ────────────── */
    .logbook-doc table {
        width: 100%;
        border-collapse: collapse;
    }
    .logbook-doc table td {
        padding: 0.5rem 0;
        vertical-align: top;
    }
    .logbook-doc h3 {
        font-family: 'Amiri', serif;
        font-size: 1.25rem;
        font-weight: 700;
        text-align: center;
        margin-bottom: 1rem;
        color: var(--text-main);
    }
    .logbook-doc .subtitle {
        text-align: center;
        margin-bottom: 1.5rem;
        color: var(--text-muted);
        font-size: 0.9rem;
    }
    .logbook-doc .doc-label {
        font-weight: 700;
        width: 33%;
        color: var(--text-main);
    }
    .logbook-doc .whitespace-pre-wrap {
        white-space: pre-wrap;
        line-height: 1.6;
    }

    /* ────────────── RESPONSIVE ────────────── */
    @media (max-width: 640px) {
        .logbook-card {
            padding: 1rem;
        }
        #logbook-preview-content {
            padding: 0.75rem;
        }
        .logbook-doc .doc-label {
            width: 40%;
        }
    }
</style>
