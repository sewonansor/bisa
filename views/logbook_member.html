<!-- views/logbook_member.html -->
<!-- Fragment Manajemen Logbook (Laporan Pertanggungjawaban) untuk Member -->
<!-- Versi: 4.1.0 - Final Fix (Stable, No Loop, Sinkron dengan Backend) -->

<!-- Konten Utama -->
<div id="member-frame-content">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold text-[var(--text-main)] font-amiri">Logbook Kegiatan</h1>
        <div class="flex gap-2">
            <button id="refresh-logbook-btn" class="btn-secondary px-4 py-2 rounded-lg transition shadow-md flex items-center gap-2">
                <i class="fas fa-sync-alt"></i> Refresh
            </button>
        </div>
    </div>

    <!-- Form Buat Logbook -->
    <div class="glass-card p-6 mb-8">
        <h2 class="text-xl font-bold text-[var(--text-main)] mb-4 font-amiri">Buat Logbook Baru</h2>
        <form id="logbook-form">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="mb-4">
                    <label class="form-label">Nama Kegiatan</label>
                    <input type="text" id="kegiatan" class="form-input" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Tempat</label>
                    <input type="text" id="tempat" class="form-input" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Tanggal Mulai</label>
                    <input type="date" id="tanggal_mulai" class="form-input" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Tanggal Selesai</label>
                    <input type="date" id="tanggal_selesai" class="form-input" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Peserta (jumlah)</label>
                    <input type="number" id="peserta" class="form-input" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Anggaran (Rp)</label>
                    <input type="number" id="anggaran" class="form-input" required>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label">Deskripsi Kegiatan</label>
                <textarea id="deskripsi" rows="4" class="form-input" required></textarea>
            </div>
            <div class="mb-4">
                <label class="form-label">File Pendukung (URL)</label>
                <input type="text" id="file_url" class="form-input" placeholder="Link Google Drive (opsional)">
            </div>
            <div class="mb-4">
                <label class="form-label">Upload File Pendukung</label>
                <input type="file" id="logbook_file" class="form-input">
            </div>
            <div class="flex flex-wrap gap-4 mt-4">
                <button type="submit" class="btn-primary"><i class="fas fa-save mr-2"></i>Simpan Logbook</button>
                <button type="button" id="preview-btn" class="btn-secondary"><i class="fas fa-eye mr-2"></i>Preview</button>
                <button type="button" id="export-pdf-btn" class="btn-danger"><i class="fas fa-file-pdf mr-2"></i>Export PDF</button>
                <button type="button" id="export-docx-btn" class="btn-primary bg-blue-800 hover:bg-blue-900"><i class="fas fa-file-word mr-2"></i>Export DOCX</button>
            </div>
        </form>
    </div>

    <!-- Preview -->
    <div id="logbook-preview" class="glass-card p-6 mb-8 hidden">
        <h2 class="text-xl font-bold text-[var(--text-main)] mb-4 font-amiri">Preview Logbook</h2>
        <div id="logbook-preview-content"></div>
    </div>

    <!-- Daftar Logbook dengan Skeleton -->
    <div class="glass-card p-6">
        <h2 class="text-xl font-bold text-[var(--text-main)] mb-4 font-amiri">Daftar Logbook Saya</h2>
        <!-- Skeleton Loading -->
        <div id="skeleton-logbook" class="space-y-4">
            <div class="skeleton-box h-20 w-full rounded-xl"></div>
            <div class="skeleton-box h-20 w-full rounded-xl"></div>
            <div class="skeleton-box h-20 w-full rounded-xl"></div>
        </div>
        <!-- Konten Asli -->
        <div id="logbook-list" class="hidden space-y-4">
            <p class="text-[var(--text-muted)]">Memuat data...</p>
        </div>
    </div>
</div>

<!-- SCRIPT INLINE (hanya konfirmasi modul, tidak ada logika loop) -->
<script>
    (function() {
        // Modul logbook_member sudah terdaftar di js/logbook_member.js via App.register('logbook_member', ...)
        // Router akan memanggil App.run('logbook_member') setelah view di-inject.
        console.log('logbook_member view loaded');
    })();
</script>

<!-- STYLE INLINE (bisa digabung ke CSS global) -->
<style>
    .form-input {
        width: 100%;
        padding: 0.6rem 1rem;
        border: 1.5px solid var(--card-border);
        border-radius: 0.75rem;
        outline: none;
        transition: all 0.3s;
        background: var(--bg-body);
        color: var(--text-main);
    }
    .form-input:focus {
        border-color: var(--text-main);
        box-shadow: 0 0 0 4px rgba(var(--text-main), 0.1);
    }
    .form-label {
        display: block;
        margin-bottom: 0.25rem;
        font-weight: 500;
        color: var(--text-muted);
    }
    #logbook-preview-content {
        background: var(--bg-body);
        padding: 1.5rem;
        border-radius: 0.5rem;
        border: 1px solid var(--card-border);
        color: var(--text-main);
    }
    .logbook-doc table {
        width: 100%;
        border-collapse: collapse;
    }
    .logbook-doc table td {
        padding: 0.5rem 0;
        vertical-align: top;
    }
    .skeleton-box {
        background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
        background-size: 200% 100%;
        animation: shimmer 1.8s infinite;
        border-radius: 0.75rem;
    }
    .dark .skeleton-box {
        background: linear-gradient(90deg, #2d3748 25%, #4a5568 50%, #2d3748 75%);
    }
    @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
    }
    .btn-secondary {
        background: #f1f5f9;
        color: #1e293b;
        border: 1px solid #e2e8f0;
        border-radius: 0.5rem;
        padding: 0.5rem 1rem;
        font-weight: 500;
        transition: all 0.3s;
    }
    .btn-secondary:hover {
        background: #e2e8f0;
        transform: translateY(-2px);
    }
    .dark .btn-secondary {
        background: rgba(255,255,255,0.05);
        color: #c4b5e0;
        border: 1px solid rgba(128,90,213,0.4);
    }
    .dark .btn-secondary:hover {
        background: rgba(128,90,213,0.2);
        border-color: #a78bfa;
    }
    .btn-danger {
        background: #dc2626;
        color: white;
        border-radius: 0.5rem;
        padding: 0.5rem 1rem;
        font-weight: 500;
        transition: all 0.3s;
    }
    .btn-danger:hover {
        background: #b91c1c;
        transform: translateY(-2px);
    }
</style>
