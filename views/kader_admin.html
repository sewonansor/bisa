<!-- views/kader_admin.html -->
<!-- Halaman Admin: Database Kader & Masa Bakti -->
<!-- Logic: js/kader_admin.js | Route: /kader_admin -->
<!-- Versi: 2.0.0 — CSS common sudah di css/style.css -->

<div id="main-content">
    <!-- ============================================================ -->
    <!-- HEADER                                                        -->
    <!-- ============================================================ -->
    <div class="flex flex-wrap justify-between items-center mb-6 gap-4">
        <h1 class="text-3xl font-bold text-[var(--text-main)] font-amiri">
            <i class="fas fa-user-graduate mr-2"></i>
            Database Kader &amp; Masa Bakti
        </h1>
        <div class="flex flex-wrap gap-2">
            <button id="refresh-kader-btn"
                    class="btn-secondary px-4 py-2 rounded-lg flex items-center gap-2">
                <i class="fas fa-sync-alt"></i>
                <span class="hidden sm:inline">Refresh</span>
            </button>
            <button id="mobile-menu-btn"
                    class="md:hidden text-2xl text-[var(--text-muted)]"
                    aria-label="Buka Menu">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- STATISTIK RINGKASAN                                           -->
    <!-- ============================================================ -->
    <div class="grid grid-cols-1 sm:grid-cols-4 gap-4 mb-6">
        <div class="stat-card p-4 rounded-xl bg-[var(--card-bg)] backdrop-blur-sm border border-[var(--card-border)]">
            <p class="text-xs sm:text-sm text-[var(--text-muted)] font-medium uppercase tracking-wider">
                Total Anggota
            </p>
            <p class="text-3xl font-bold text-[var(--text-main)] mt-1" id="total-anggota">0</p>
        </div>
        <div class="stat-card p-4 rounded-xl bg-[var(--card-bg)] backdrop-blur-sm border border-[var(--card-border)]">
            <p class="text-xs sm:text-sm text-[var(--text-muted)] font-medium uppercase tracking-wider">
                Admin
            </p>
            <p class="text-3xl font-bold text-red-600 mt-1" id="total-admin">0</p>
        </div>
        <div class="stat-card p-4 rounded-xl bg-[var(--card-bg)] backdrop-blur-sm border border-[var(--card-border)]">
            <p class="text-xs sm:text-sm text-[var(--text-muted)] font-medium uppercase tracking-wider">
                Member
            </p>
            <p class="text-3xl font-bold text-blue-600 mt-1" id="total-member">0</p>
        </div>
        <div class="stat-card p-4 rounded-xl bg-[var(--card-bg)] backdrop-blur-sm border border-[var(--card-border)]">
            <p class="text-xs sm:text-sm text-[var(--text-muted)] font-medium uppercase tracking-wider">
                Angkatan Terbanyak
            </p>
            <p class="text-xl font-bold text-[var(--text-main)] mt-1" id="angkatan-terbanyak">-</p>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- TABEL KADER                                                   -->
    <!-- ============================================================ -->
    <div class="table-wrapper">
        <div class="overflow-x-auto">
            <table class="w-full">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama</th>
                        <th>Username</th>
                        <th>Role</th>
                        <th>Alamat</th>
                        <th>Angkatan</th>
                        <th>Riwayat Jabatan</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="table-body" class="divide-y divide-[var(--card-border)]">
                    <!-- SKELETON LOADING -->
                    <tr id="kader-skeleton">
                        <td colspan="8" class="text-center py-8">
                            <i class="fas fa-spinner fa-spin text-2xl text-[var(--text-muted)]"></i>
                            <p class="text-[var(--text-muted)] text-sm mt-2">Memuat data kader...</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- ============================================================ -->
<!-- MODAL: EDIT KADER                                             -->
<!-- ============================================================ -->
<div id="kader-modal"
     class="fixed inset-0 bg-black/50 hidden items-center justify-center z-[9999] backdrop-blur-sm p-4">
    <div id="modal-content"
         class="bg-[var(--card-bg)] rounded-2xl shadow-2xl max-w-md w-full p-6 transform scale-95 opacity-0 transition-all duration-300 max-h-[90vh] overflow-y-auto">

        <h2 class="text-2xl font-bold mb-4 text-[var(--text-main)] font-amiri">
            Edit Data Kader
        </h2>

        <form id="kader-form" class="space-y-4">
            <input type="hidden" id="edit-id">

            <div>
                <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                    Nama Lengkap <span class="text-red-500">*</span>
                </label>
                <input type="text" id="kader_nama"
                       class="form-input"
                       placeholder="Nama lengkap kader"
                       required>
            </div>

            <div>
                <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                    Username <span class="text-red-500">*</span>
                </label>
                <input type="text" id="kader_username"
                       class="form-input"
                       placeholder="Username untuk login"
                       required>
            </div>

            <div>
                <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                    Role
                </label>
                <select id="kader_role" class="form-input">
                    <option value="member">Member</option>
                    <option value="admin">Admin</option>
                </select>
            </div>

            <div>
                <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                    Alamat / Kalurahan
                </label>
                <input type="text" id="kader_alamat"
                       class="form-input"
                       placeholder="Contoh: Panggungharjo">
            </div>

            <div>
                <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                    Angkatan (tahun masuk)
                </label>
                <input type="text" id="kader_angkatan"
                       class="form-input"
                       placeholder="Contoh: 2024">
            </div>

            <div>
                <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                    Riwayat Jabatan
                </label>
                <input type="text" id="kader_riwayat_jabatan"
                       class="form-input"
                       placeholder="Contoh: Ketua, Sekretaris, dll">
            </div>

            <div class="flex justify-end gap-2 pt-2">
                <button type="button" id="modal-close"
                        class="btn-secondary px-4 py-2 rounded-lg">
                    Batal
                </button>
                <button type="submit"
                        class="btn-primary px-4 py-2 rounded-lg">
                    <i class="fas fa-save mr-2"></i>
                    <span>Simpan</span>
                </button>
            </div>
        </form>
    </div>
</div>

<!-- ============================================================ -->

        console.log('[View] kader_admin.html loaded — logic handled by js/kader_admin.js');
    })();
</script>

<style>
    /* View tidak butuh CSS khusus — semua pakai style.css.
       JS akan auto-inject:
       - kader-stats (bisa override stat existing)
       - kader-search-wrap (search + filter role + filter angkatan + sort)
       - kader-bulk-bar (bulk delete)
       - kader-detail-modal (detail preview) */

    /* ────────────── RESPONSIVE ────────────── */
    @media (max-width: 640px) {
        /* Modal padding lebih kecil */
        #modal-content {
            padding: 1rem;
        }
    }
