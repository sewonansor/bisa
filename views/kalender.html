<!-- views/kalender.html -->
<!-- Fragment Halaman Kalender Publik -->
<!-- Terbaru lengkap semua menu berfungsi tanpa error siap pakai SPA -->

<!-- HERO SECTION -->
<section class="hero-light dark:hero-dark py-20">
    <div class="container mx-auto px-4 text-center">
        <h1 class="text-4xl md:text-6xl font-bold mb-4 glow-text font-amiri">Kalender Kegiatan</h1>
        <p class="text-xl md:text-2xl mb-8 opacity-90">Timeline lengkap persiapan, pelaksanaan, dan pasca acara</p>
    </div>
</section>

<!-- KALENDER -->
<section class="py-16 bg-gray-100/50 dark:bg-transparent">
    <div class="container mx-auto px-4">
        <h2 class="text-3xl font-bold text-center mb-12 text-gray-800 dark:text-purple-200 glow-text font-amiri">Timeline Kegiatan</h2>
        <div id="calendar" class="max-w-5xl mx-auto"></div>
    </div>
</section>

<!-- SCRIPT INLINE (akan dieksekusi oleh router) -->
<script>
    (function() {
        // Daftarkan modul kalender publik
        App.register('kalender', function() {
            const calendarEl = document.getElementById('calendar');
            if (!calendarEl) return;

            // Fungsi load data timeline (sama seperti di admin)
            async function loadTimelineData() {
                const [lpjResult, eventsResult] = await Promise.all([
                    apiCall('getLpj', 'POST', {}),
                    apiCall('getEvents', 'POST', {})
                ]);

                const events = [];

                // 1. Dari LPJ (kegiatan yang sudah/sedang berjalan) - warna hijau
                if (lpjResult.success) {
                    lpjResult.data.forEach(item => {
                        events.push({
                            id: 'lpj_' + item.id,
                            title: '📋 ' + (item.kegiatan || 'Kegiatan'),
                            start: item.tanggal_mulai,
                            end: item.tanggal_selesai,
                            backgroundColor: '#16a34a',
                            borderColor: '#16a34a',
                            textColor: '#ffffff',
                            extendedProps: {
                                type: 'kegiatan',
                                deskripsi: item.deskripsi || '',
                                tempat: item.tempat || '-'
                            }
                        });
                    });
                }

                // 2. Dari Events (rencana/persiapan) - warna biru
                if (eventsResult.success) {
                    eventsResult.data.forEach(item => {
                        events.push({
                            id: 'evt_' + item.id,
                            title: '📌 ' + (item.title || 'Rencana'),
                            start: item.start,
                            end: item.end || item.start,
                            backgroundColor: '#2563eb',
                            borderColor: '#2563eb',
                            textColor: '#ffffff',
                            extendedProps: {
                                type: 'rencana'
                            }
                        });
                    });
                }

                return events;
            }

            // Inisialisasi kalender
            function initCalendar(events) {
                // Deteksi dark mode untuk override warna
                const isDark = document.documentElement.classList.contains('dark');
                if (isDark) {
                    events.forEach(e => {
                        if (e.extendedProps.type === 'kegiatan') {
                            e.backgroundColor = '#16a34a';
                            e.borderColor = '#16a34a';
                        } else {
                            e.backgroundColor = '#7c3aed';
                            e.borderColor = '#7c3aed';
                        }
                    });
                }

                const calendar = new FullCalendar.Calendar(calendarEl, {
                    initialView: 'dayGridMonth',
                    headerToolbar: {
                        left: 'prev,next today',
                        center: 'title',
                        right: 'dayGridMonth,timeGridWeek,listWeek'
                    },
                    events: events,
                    eventClick: function(info) {
                        const event = info.event;
                        let detail = `📅 ${event.title}\n`;
                        detail += `📆 Mulai: ${event.start.toLocaleDateString('id-ID')}`;
                        if (event.end && event.end.toDateString() !== event.start.toDateString()) {
                            detail += `\n📆 Selesai: ${event.end.toLocaleDateString('id-ID')}`;
                        }
                        if (event.extendedProps.tempat) {
                            detail += `\n📍 Tempat: ${event.extendedProps.tempat}`;
                        }
                        if (event.extendedProps.deskripsi) {
                            detail += `\n📝 Deskripsi: ${event.extendedProps.deskripsi}`;
                        }
                        alert(detail);
                    },
                    windowResize: function(view) {
                        calendar.render();
                    }
                });
                calendar.render();
            }

            // Load data dan inisialisasi
            loadTimelineData().then(events => initCalendar(events));
        });

        // Modul sudah terdaftar, router akan memanggil App.run('kalender')
        // Jika kita ingin langsung menjalankan saat view dimuat (tidak perlu menunggu router),
        // kita bisa panggil App.run('kalender') di sini, tapi router sudah melakukannya.
        // Untuk keamanan, kita biarkan saja.
    })();
</script>
