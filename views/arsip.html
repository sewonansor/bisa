<!-- views/arsip.html -->
<!-- Halaman Arsip Publik -->

<!-- ============================================================ -->
<!-- HERO SECTION                                                  -->
<!-- ============================================================ -->
<section class="arsip-hero py-20">
    <div class="container mx-auto px-4 text-center">
        <h1 class="text-4xl md:text-6xl font-bold mb-4 glow-text font-amiri">
            <i class="fas fa-archive mr-2"></i>Arsip Digital
        </h1>
        <p class="text-xl md:text-2xl mb-8 opacity-90 max-w-3xl mx-auto">
            Kumpulan dokumentasi, laporan, dan arsip PAC GP Ansor Kapanewon Sewon
        </p>
    </div>
</section>

<!-- ============================================================ -->
<!-- FILTER TAHUN                                                  -->
<!-- ============================================================ -->
<section class="py-8 bg-white/50 dark:bg-transparent border-b border-[var(--card-border)]">
    <div class="container mx-auto px-4">
        <div class="flex flex-wrap justify-center gap-3">
            <button type="button"
                    class="filter-btn filter-btn-active"
                    data-year="all">
                <i class="fas fa-layer-group mr-1"></i>Semua
            </button>
            <button type="button" class="filter-btn" data-year="2026">2026</button>
            <button type="button" class="filter-btn" data-year="2025">2025</button>
            <button type="button" class="filter-btn" data-year="2024">2024</button>
            <button type="button" class="filter-btn" data-year="2023">2023</button>
        </div>
    </div>
</section>

<!-- ============================================================ -->
<!-- DAFTAR ARSIP                                                  -->
<!-- ============================================================ -->
<section class="py-16 bg-gray-100/50 dark:bg-transparent">
    <div class="container mx-auto px-4">
        <h2 class="text-3xl font-bold text-center mb-12 text-[var(--text-main)] font-amiri glow-text">
            Daftar Arsip
        </h2>

        <!-- SKELETON LOADING -->
        <div id="arsip-skeleton" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="light-card dark:dark-card p-6">
                <div class="skeleton-box h-32 w-full"></div>
            </div>
            <div class="light-card dark:dark-card p-6">
                <div class="skeleton-box h-32 w-full"></div>
            </div>
            <div class="light-card dark:dark-card p-6">
                <div class="skeleton-box h-32 w-full"></div>
            </div>
            <div class="light-card dark:dark-card p-6">
                <div class="skeleton-box h-32 w-full"></div>
            </div>
            <div class="light-card dark:dark-card p-6">
                <div class="skeleton-box h-32 w-full"></div>
            </div>
            <div class="light-card dark:dark-card p-6">
                <div class="skeleton-box h-32 w-full"></div>
            </div>
        </div>

        <!-- KONTEN ASLI (diisi oleh js/arsip.js) -->
        <div id="arsip-list" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Placeholder — akan di-replace oleh JavaScript -->
        </div>
    </div>
</section>

        console.log('[View] arsip.html loaded — logic handled by js/arsip.js');

<!-- ============================================================ -->
<!-- STYLE INLINE — Khusus view arsip saja                         -->
<!-- Common styles (skeleton-box, btn-secondary) sudah di style.css -->
<!-- ============================================================ -->
<style>
    /* ────────────── HERO ────────────── */
    .arsip-hero {
        background: linear-gradient(145deg, #ffffff 0%, #e0e7ff 100%);
        color: #1e293b;
    }
    .dark .arsip-hero {
        background: linear-gradient(145deg, #1a0f2e 0%, #2d1b4e 100%);
        color: #f0eaff;
        box-shadow: inset 0 0 100px rgba(128, 90, 213, 0.1);
    }
    .dark .glow-text {
        text-shadow: 0 0 20px rgba(167, 139, 250, 0.3);
    }

    /* ────────────── CARD ────────────── */
    .light-card {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        border: 1px solid rgba(255, 255, 255, 0.5);
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        border-radius: 1.5rem;
        transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .light-card:hover {
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        transform: translateY(-6px) scale(1.01);
        border-color: rgba(37, 99, 235, 0.2);
    }

    .dark .dark-card {
        background: rgba(20, 15, 40, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(128, 90, 213, 0.3);
        box-shadow: 0 8px 32px rgba(128, 90, 213, 0.2);
        border-radius: 1rem;
        transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .dark .dark-card:hover {
        box-shadow: 0 12px 40px rgba(128, 90, 213, 0.4);
        transform: scale(1.03);
        border-color: rgba(168, 85, 247, 0.6);
    }

    /* ────────────── FILTER BUTTONS ────────────── */
    .filter-btn {
        padding: 0.5rem 1rem;
        border-radius: 0.5rem;
        font-weight: 600;
        font-size: 0.875rem;
        background: #e5e7eb;
        color: #374151;
        border: none;
        cursor: pointer;
        font-family: inherit;
        transition: all 0.3s var(--ease-smooth);
        display: inline-flex;
        align-items: center;
    }
    .filter-btn:hover {
        background: #d1d5db;
        transform: translateY(-1px);
    }
    .filter-btn.filter-btn-active {
        background: #16a34a;
        color: #ffffff;
    }
    .dark .filter-btn {
        background: #374151;
        color: #d1d5db;
    }
    .dark .filter-btn:hover {
        background: #4b5563;
    }
    .dark .filter-btn.filter-btn-active {
        background: #16a34a;
        color: #ffffff;
    }

    /* ────────────── CATEGORY TAGS ────────────── */
    .category-tag {
        display: inline-block;
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        font-size: 0.75rem;
        font-weight: 600;
    }
    .category-tag-pdf   { background: #fee2e2; color: #dc2626; }
    .category-tag-doc   { background: #dbeafe; color: #2563eb; }
    .category-tag-xlsx  { background: #dcfce7; color: #16a34a; }
    .category-tag-img   { background: #fef3c7; color: #d97706; }
    .category-tag-video { background: #f3e8ff; color: #7c3aed; }
    .category-tag-other { background: #f3f4f6; color: #4b5563; }

    .dark .category-tag-pdf   { background: #7f1d1d; color: #fca5a5; }
    .dark .category-tag-doc   { background: #1e3a5f; color: #93c5fd; }
    .dark .category-tag-xlsx  { background: #14532d; color: #86efac; }
    .dark .category-tag-img   { background: #78350f; color: #fcd34d; }
    .dark .category-tag-video { background: #4c1d95; color: #c4b5fd; }
    .dark .category-tag-other { background: #374151; color: #d1d5db; }

    /* ────────────── RESPONSIVE ────────────── */
    @media (max-width: 640px) {
        .arsip-hero h1 { font-size: 2rem !important; }
        .filter-btn {
            font-size: 0.8rem;
            padding: 0.4rem 0.8rem;
        }
    }
</style>
