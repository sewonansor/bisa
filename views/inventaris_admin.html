<!-- views/inventaris_admin.html -->
<!-- Halaman Admin: Manajemen Inventaris & Peminjaman -->
<!-- Logic: js/inventaris_admin.js | Route: /inventaris_admin | Libs: jsbarcode -->
<!-- Versi: 2.0.0 — CSS common sudah di css/style.css -->

<div id="main-content">
    <!-- ============================================================ -->
    <!-- HEADER                                                        -->
    <!-- ============================================================ -->
    <div class="flex flex-wrap justify-between items-center mb-6 gap-4">
        <h1 class="text-3xl font-bold text-[var(--text-main)] font-amiri">
            <i class="fas fa-boxes mr-2"></i>
            Manajemen Inventaris &amp; Peminjaman
        </h1>
        <div class="flex flex-wrap gap-2">
            <button id="refresh-inventaris-btn"
                    class="btn-secondary px-4 py-2 rounded-lg flex items-center gap-2">
                <i class="fas fa-sync-alt"></i>
                <span class="hidden sm:inline">Refresh</span>
            </button>
            <button id="add-barang-btn"
                    class="btn-primary px-4 py-2 rounded-lg flex items-center gap-2">
                <i class="fas fa-plus"></i>
                <span>Tambah Barang</span>
            </button>
            <button id="add-pinjam-btn"
                    class="btn-primary px-4 py-2 rounded-lg flex items-center gap-2">
                <i class="fas fa-hand-holding"></i>
                <span>Catat Pinjam</span>
            </button>
            <button id="mobile-menu-btn"
                    class="md:hidden text-2xl text-[var(--text-muted)]"
                    aria-label="Buka Menu">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- STATISTIK                                                     -->
    <!-- ============================================================ -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        <div class="stat-card p-4 rounded-xl bg-[var(--card-bg)] border border-[var(--card-border)]">
            <p class="text-xs sm:text-sm text-[var(--text-muted)] uppercase tracking-wider">
                Total Barang
            </p>
            <p class="text-2xl font-bold text-[var(--text-main)] mt-1" id="total-barang">0</p>
        </div>
        <div class="stat-card p-4 rounded-xl bg-[var(--card-bg)] border border-[var(--card-border)]">
            <p class="text-xs sm:text-sm text-[var(--text-muted)] uppercase tracking-wider">
                Kondisi Baik
            </p>
            <p class="text-2xl font-bold text-green-600 mt-1" id="total-baik">0</p>
        </div>
        <div class="stat-card p-4 rounded-xl bg-[var(--card-bg)] border border-[var(--card-border)]">
            <p class="text-xs sm:text-sm text-[var(--text-muted)] uppercase tracking-wider">
                Dipinjam
            </p>
            <p class="text-2xl font-bold text-blue-600 mt-1" id="total-dipinjam">0</p>
        </div>
        <div class="stat-card p-4 rounded-xl bg-[var(--card-bg)] border border-[var(--card-border)]">
            <p class="text-xs sm:text-sm text-[var(--text-muted)] uppercase tracking-wider">
                Rusak
            </p>
            <p class="text-2xl font-bold text-red-600 mt-1" id="total-rusak">0</p>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- TAB NAVIGATION                                                -->
    <!-- ============================================================ -->
    <div class="flex border-b border-[var(--card-border)] mb-4 gap-1">
        <button type="button"
                class="tab-btn active py-2 px-4 text-sm font-semibold"
                data-tab="barang">
            <i class="fas fa-box mr-1"></i> Barang
        </button>
        <button type="button"
                class="tab-btn py-2 px-4 text-sm font-medium text-[var(--text-muted)] hover:text-[var(--text-main)]"
                data-tab="peminjaman">
            <i class="fas fa-hand-holding mr-1"></i> Peminjaman
        </button>
    </div>

    <!-- ============================================================ -->
    <!-- TAB: BARANG                                                   -->
    <!-- ============================================================ -->
    <div id="tab-barang" class="tab-content">
        <div class="table-wrapper">
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Nama Barang</th>
                            <th>Jumlah</th>
                            <th>Kondisi</th>
                            <th>Lokasi</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="barang-table-body" class="divide-y divide-[var(--card-border)]">
                        <tr>
                            <td colspan="6" class="text-center py-6">
                                <i class="fas fa-spinner fa-spin text-xl text-[var(--text-muted)]"></i>
                                <p class="text-[var(--text-muted)] text-sm mt-2">Memuat data barang...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- TAB: PEMINJAMAN                                               -->
    <!-- ============================================================ -->
    <div id="tab-peminjaman" class="tab-content hidden">
        <div class="table-wrapper">
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Barang</th>
                            <th>Peminjam</th>
                            <th>Tgl Pinjam</th>
                            <th>Tgl Kembali</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="pinjam-table-body" class="divide-y divide-[var(--card-border)]">
                        <tr>
                            <td colspan="7" class="text-center py-6">
                                <i class="fas fa-spinner fa-spin text-xl text-[var(--text-muted)]"></i>
                                <p class="text-[var(--text-muted)] text-sm mt-2">Memuat data peminjaman...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- ============================================================ -->
<!-- MODAL: BARANG (Tambah/Edit)                                   -->
<!-- ============================================================ -->
<div id="barang-modal"
     class="fixed inset-0 bg-black/50 hidden items-center justify-center z-[9999] backdrop-blur-sm p-4">
    <div id="barang-modal-content"
         class="bg-[var(--card-bg)] rounded-2xl shadow-2xl max-w-md w-full p-6 transform scale-95 opacity-0 transition-all duration-300 max-h-[90vh] overflow-y-auto">

        <h2 id="barang-modal-title"
            class="text-2xl font-bold mb-4 text-[var(--text-main)] font-amiri">
            Tambah Barang
        </h2>

        <form id="barang-form" class="space-y-4">
            <input type="hidden" id="barang-id">

            <div>
                <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                    Nama Barang <span class="text-red-500">*</span>
                </label>
                <input type="text" id="barang_nama"
                       class="form-input"
                       placeholder="Contoh: Sound System"
                       required>
            </div>

            <div>
                <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                    Jumlah <span class="text-red-500">*</span>
                </label>
                <input type="number" id="barang_jumlah"
                       class="form-input"
                       placeholder="0"
                       min="0"
                       required>
            </div>

            <div>
                <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                    Kondisi
                </label>
                <select id="barang_kondisi" class="form-input">
                    <option value="Baik">Baik</option>
                    <option value="Rusak Ringan">Rusak Ringan</option>
                    <option value="Rusak Berat">Rusak Berat</option>
                </select>
            </div>

            <div>
                <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                    Lokasi
                </label>
                <input type="text" id="barang_lokasi"
                       class="form-input"
                       placeholder="Contoh: Gudang Utama">
            </div>

            <div class="flex justify-end gap-2 pt-2">
                <button type="button" id="barang-modal-close"
                        class="btn-secondary px-4 py-2 rounded-lg">
                    Batal
                </button>
                <button type="submit"
                        class="btn-primary px-4 py-2 rounded-lg">
                    <i class="fas fa-save mr-2"></i>
                    <span>Simpan</span>
                </button>
            </div>
        </form>
    </div>
</div>

<!-- ============================================================ -->
<!-- MODAL: PEMINJAMAN                                             -->
<!-- ============================================================ -->
<div id="pinjam-modal"
     class="fixed inset-0 bg-black/50 hidden items-center justify-center z-[9999] backdrop-blur-sm p-4">
    <div id="pinjam-modal-content"
         class="bg-[var(--card-bg)] rounded-2xl shadow-2xl max-w-md w-full p-6 transform scale-95 opacity-0 transition-all duration-300 max-h-[90vh] overflow-y-auto">

        <h2 class="text-2xl font-bold mb-4 text-[var(--text-main)] font-amiri">
            Catat Peminjaman
        </h2>

        <form id="pinjam-form" class="space-y-4">
            <div>
                <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                    Pilih Barang <span class="text-red-500">*</span>
                </label>
                <select id="pinjam_barang_id" class="form-input" required>
                    <option value="">-- Pilih Barang --</option>
                </select>
            </div>

            <div>
                <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                    Nama Peminjam <span class="text-red-500">*</span>
                </label>
                <input type="text" id="pinjam_peminjam"
                       class="form-input"
                       placeholder="Nama lengkap peminjam"
                       required>
            </div>

            <div>
                <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                    Tanggal Pinjam <span class="text-red-500">*</span>
                </label>
                <input type="date" id="pinjam_tanggal"
                       class="form-input"
                       required>
            </div>

            <div>
                <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                    Tanggal Kembali <span class="text-xs font-normal text-[var(--text-muted)]">(opsional)</span>
                </label>
                <input type="date" id="pinjam_tanggal_kembali"
                       class="form-input">
            </div>

            <div class="flex justify-end gap-2 pt-2">
                <button type="button" id="pinjam-modal-close"
                        class="btn-secondary px-4 py-2 rounded-lg">
                    Batal
                </button>
                <button type="submit"
                        class="btn-primary px-4 py-2 rounded-lg">
                    <i class="fas fa-save mr-2"></i>
                    <span>Simpan</span>
                </button>
            </div>
        </form>
    </div>
</div>

<!-- ============================================================ -->
<!-- SCRIPT INLINE — Konfirmasi saja (no emoji)                    -->
<!-- ============================================================ -->
<script>
    (function() {
        console.log('[View] inventaris_admin.html loaded — logic handled by js/inventaris_admin.js');
    })();
</script>

<!-- ============================================================ -->
<!-- STYLE INLINE — Khusus view inventaris_admin saja              -->
<!-- Common styles (stat-card, btn-*, form-input, table-wrapper)   -->
<!-- sudah di-load dari css/style.css                              -->
<!-- ============================================================ -->
<style>
    /* ────────────── TAB BUTTONS ────────────── */
    .tab-btn {
        cursor: pointer;
        border: none;
        background: transparent;
        border-bottom: 2px solid transparent;
        font-family: inherit;
        display: inline-flex;
        align-items: center;
        transition: all 220ms var(--ease-smooth);
        color: var(--text-muted);
    }
    .tab-btn:hover {
        color: var(--text-main);
    }
    .tab-btn.active {
        border-bottom-color: var(--text-main);
        color: var(--text-main);
        font-weight: 700;
    }
    .dark .tab-btn.active {
        border-bottom-color: var(--accent-400);
        color: var(--accent-400);
    }

    /* ────────────── RESPONSIVE ────────────── */
    @media (max-width: 640px) {
        .tab-btn {
            font-size: 0.8rem;
            padding: 0.5rem 0.75rem;
        }
    }
</style>
