<!-- STYLE INLINE — Khusus view ringkasan saja                     -->
<!-- Common styles (btn-primary, btn-secondary) sudah di           -->
<!-- css/style.css                                                 -->
<!-- ============================================================ -->
<style>
    /* ────────────── QUICK NAV LINK ────────────── */
    .quick-nav-link {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.35rem 0.85rem;
        font-size: 0.75rem;
        font-weight: 500;
        border-radius: 9999px;
        background: var(--card-bg);
        color: var(--text-main);
        border: 1px solid var(--card-border);
        text-decoration: none;
        transition: all 180ms var(--ease-smooth);
    }
    .quick-nav-link:hover {
        background: var(--brand-700);
        color: #ffffff;
        border-color: var(--brand-700);
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(15, 41, 34, 0.15);
    }
    .dark .quick-nav-link:hover {
        background: var(--accent-400);
        color: var(--brand-800);
        border-color: var(--accent-400);
    }

    /* ────────────── PREVIEW CARD (di-render oleh JS) ────────────── */
    .preview-card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 1rem;
        padding: 1.5rem;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        transition: all 0.3s var(--ease-smooth);
    }
    .preview-card:hover {
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }
    .preview-card h3 {
        font-size: 1.25rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
        color: var(--text-main);
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-family: 'Amiri', serif;
    }
    .preview-card h3 i {
        color: #fbbf24;
    }
    .preview-card .count-badge {
        background: var(--bg-stats);
        border-radius: 9999px;
        padding: 0.15rem 0.75rem;
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--text-muted);
        margin-left: 0.5rem;
    }
    .preview-card .table-wrapper {
        max-height: 300px;
        overflow-y: auto;
        border-radius: 0.75rem;
        border: 1px solid var(--card-border);
        margin-top: 0.75rem;
    }
    .preview-card table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.85rem;
    }
    .preview-card th,
    .preview-card td {
        padding: 0.5rem 0.75rem;
        border-bottom: 1px solid var(--card-border);
        text-align: left;
        white-space: nowrap;
    }
    .preview-card th {
        background: var(--bg-stats);
        font-weight: 600;
        position: sticky;
        top: 0;
        z-index: 10;
    }
    .preview-card tr:hover {
        background: var(--bg-stats);
    }
    .preview-card .empty-msg {
        color: var(--text-muted);
        font-style: italic;
        margin-top: 0.5rem;
    }
    .preview-card .show-all-link {
        display: inline-block;
        margin-top: 0.75rem;
        font-size: 0.85rem;
        color: var(--text-main);
        text-decoration: underline;
    }

    /* ────────────── LOADING SPINNER (state awal) ────────────── */
    .loading-spinner {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 300px;
    }
</style>
