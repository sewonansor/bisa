<!-- views/auth.html -->
<!-- Fragment Halaman Login & Register -->
<!-- Tampilan Premium, Elegan, Modern -->
<!-- Terbaru lengkap semua menu berfungsi tanpa error siap pakai SPA -->

<div id="auth-wrapper">
    <!-- Card Utama dengan glassmorphism premium -->
    <div class="glass-card p-8 md:p-10 rounded-3xl shadow-2xl max-w-md w-full relative overflow-hidden mx-auto border border-white/30 dark:border-slate-700/50 backdrop-blur-sm">
        
        <!-- Ornamen dekoratif di sudut (estetika premium) -->
        <div class="absolute -top-20 -right-20 w-64 h-64 bg-gradient-to-br from-[#0f2922]/10 to-transparent rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-20 -left-20 w-64 h-64 bg-gradient-to-tr from-[#fbbf24]/10 to-transparent rounded-full blur-3xl pointer-events-none"></div>

        <!-- Logo -->
        <div class="logo-container flex justify-center mb-6 relative z-10">
            <img src="logo-ansor.webp" alt="Logo Ansor" class="h-20 w-auto object-contain drop-shadow-sm" />
        </div>

        <!-- Title -->
        <div class="text-center mb-8 relative z-10">
            <h2 class="text-3xl md:text-4xl font-bold text-[#0f2922] dark:text-white font-amiri tracking-wide" id="form-title">Login</h2>
            <p class="text-sm text-[var(--text-muted)] dark:text-[var(--text-muted)] mt-2 font-light tracking-wide">Masuk ke portal Ansor Sewon</p>
        </div>

        <!-- Tab Navigation -->
        <div class="flex mb-8 border-b border-gray-200 dark:border-gray-700/50 relative z-10">
            <button class="flex-1 py-3 text-center font-semibold text-sm tracking-wide transition-all duration-300 border-b-2 border-transparent text-gray-400 hover:text-[#0f2922] dark:hover:text-white" id="login-tab">Login</button>
            <button class="flex-1 py-3 text-center font-semibold text-sm tracking-wide transition-all duration-300 border-b-2 border-transparent text-gray-400 hover:text-[#0f2922] dark:hover:text-white" id="register-tab">Register</button>
        </div>

        <!-- ===== LOGIN CONTAINER ===== -->
        <div id="login-form-container" class="block w-full relative z-10">
            <form id="login-form" class="space-y-5">
                <div>
                    <label class="block text-[var(--text-muted)] dark:text-[var(--text-muted)] text-sm font-medium mb-1.5">Email / Username</label>
                    <input type="text" id="login-username" class="w-full px-4 py-3 border border-gray-200 dark:border-gray-700/60 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#fbbf24]/40 focus:border-[#fbbf24] bg-white/80 dark:bg-gray-800/50 backdrop-blur-sm text-[var(--text-main)] dark:text-[var(--text-main)] placeholder:text-gray-400 transition-all duration-300" placeholder="Masukkan email atau username" required>
                </div>
                <div>
                    <label class="block text-[var(--text-muted)] dark:text-[var(--text-muted)] text-sm font-medium mb-1.5">Password</label>
                    <div class="relative">
                        <input type="password" id="login-password" class="w-full px-4 py-3 border border-gray-200 dark:border-gray-700/60 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#fbbf24]/40 focus:border-[#fbbf24] bg-white/80 dark:bg-gray-800/50 backdrop-blur-sm text-[var(--text-main)] dark:text-[var(--text-main)] placeholder:text-gray-400 pr-10 transition-all duration-300" placeholder="Masukkan password" required>
                        <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-[#0f2922] dark:hover:text-white transition-colors" onclick="togglePassword('login-password', this)">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="text-right">
                    <a href="#" id="forgot-account-link" class="text-sm text-[#0f2922] dark:text-[#fbbf24] hover:underline font-medium">Lupa Akun?</a>
                </div>
                <button type="submit" class="w-full btn-auth py-3 rounded-xl font-semibold text-base bg-gradient-to-r from-[#0f2922] to-[#1a4038] hover:from-[#1a4038] hover:to-[#0f2922] text-white shadow-lg hover:shadow-xl transition-all duration-300 transform hover:-translate-y-0.5">Login</button>
                <div id="login-message" class="mt-2 text-center text-sm"></div>
            </form>
        </div>

        <!-- ===== REGISTER CONTAINER ===== -->
        <div id="register-form-container" class="hidden w-full relative z-10">
            <form id="register-form" class="space-y-4">
                <div>
                    <label class="block text-[var(--text-muted)] dark:text-[var(--text-muted)] text-sm font-medium mb-1.5">Nama Lengkap</label>
                    <input type="text" id="reg-nama" class="w-full px-4 py-3 border border-gray-200 dark:border-gray-700/60 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#fbbf24]/40 focus:border-[#fbbf24] bg-white/80 dark:bg-gray-800/50 backdrop-blur-sm text-[var(--text-main)] dark:text-[var(--text-main)] placeholder:text-gray-400 transition-all duration-300" placeholder="Masukkan nama lengkap" required>
                </div>
                <div>
                    <label class="block text-[var(--text-muted)] dark:text-[var(--text-muted)] text-sm font-medium mb-1.5">Username / Email</label>
                    <input type="text" id="reg-username" class="w-full px-4 py-3 border border-gray-200 dark:border-gray-700/60 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#fbbf24]/40 focus:border-[#fbbf24] bg-white/80 dark:bg-gray-800/50 backdrop-blur-sm text-[var(--text-main)] dark:text-[var(--text-main)] placeholder:text-gray-400 transition-all duration-300" placeholder="Buat username atau gunakan email" required>
                </div>
                <div>
                    <label class="block text-[var(--text-muted)] dark:text-[var(--text-muted)] text-sm font-medium mb-1.5">Password</label>
                    <div class="relative">
                        <input type="password" id="reg-password" class="w-full px-4 py-3 border border-gray-200 dark:border-gray-700/60 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#fbbf24]/40 focus:border-[#fbbf24] bg-white/80 dark:bg-gray-800/50 backdrop-blur-sm text-[var(--text-main)] dark:text-[var(--text-main)] placeholder:text-gray-400 pr-10 transition-all duration-300" placeholder="Minimal 6 karakter" required>
                        <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-[#0f2922] dark:hover:text-white transition-colors" onclick="togglePassword('reg-password', this)">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div>
                    <label class="block text-[var(--text-muted)] dark:text-[var(--text-muted)] text-sm font-medium mb-1.5">Konfirmasi Password</label>
                    <div class="relative">
                        <input type="password" id="reg-password-confirm" class="w-full px-4 py-3 border border-gray-200 dark:border-gray-700/60 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#fbbf24]/40 focus:border-[#fbbf24] bg-white/80 dark:bg-gray-800/50 backdrop-blur-sm text-[var(--text-main)] dark:text-[var(--text-main)] placeholder:text-gray-400 pr-10 transition-all duration-300" placeholder="Masukkan ulang password" required>
                        <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-[#0f2922] dark:hover:text-white transition-colors" onclick="togglePassword('reg-password-confirm', this)">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div>
                    <label class="block text-[var(--text-muted)] dark:text-[var(--text-muted)] text-sm font-medium mb-1.5">No. HP</label>
                    <input type="text" id="reg-no_hp" class="w-full px-4 py-3 border border-gray-200 dark:border-gray-700/60 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#fbbf24]/40 focus:border-[#fbbf24] bg-white/80 dark:bg-gray-800/50 backdrop-blur-sm text-[var(--text-main)] dark:text-[var(--text-main)] placeholder:text-gray-400 transition-all duration-300" placeholder="08xxxxxxxxxx" required>
                </div>
                <div>
                    <label class="block text-[var(--text-muted)] dark:text-[var(--text-muted)] text-sm font-medium mb-1.5">Kalurahan</label>
                    <select id="reg-kalurahan" class="w-full px-4 py-3 border border-gray-200 dark:border-gray-700/60 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#fbbf24]/40 focus:border-[#fbbf24] bg-white/80 dark:bg-gray-800/50 backdrop-blur-sm text-[var(--text-main)] dark:text-[var(--text-main)] transition-all duration-300" required>
                        <option value="">-- Pilih Kalurahan --</option>
                        <option value="Panggungharjo">Panggungharjo</option>
                        <option value="Bangunharjo">Bangunharjo</option>
                        <option value="Pendowoharjo">Pendowoharjo</option>
                        <option value="Timbulharjo">Timbulharjo</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[var(--text-muted)] dark:text-[var(--text-muted)] text-sm font-medium mb-1.5">Pertanyaan Keamanan</label>
                    <select id="reg-pertanyaan" class="w-full px-4 py-3 border border-gray-200 dark:border-gray-700/60 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#fbbf24]/40 focus:border-[#fbbf24] bg-white/80 dark:bg-gray-800/50 backdrop-blur-sm text-[var(--text-main)] dark:text-[var(--text-main)] transition-all duration-300" required>
                        <option value="">-- Pilih Pertanyaan --</option>
                        <option value="Siapa nama pahlawan nasional favorit Anda?">Siapa nama pahlawan nasional favorit Anda?</option>
                        <option value="Apa nama kota kelahiran Anda?">Apa nama kota kelahiran Anda?</option>
                        <option value="Siapa nama guru SD favorit Anda?">Siapa nama guru SD favorit Anda?</option>
                        <option value="Apa nama hewan peliharaan pertama Anda?">Apa nama hewan peliharaan pertama Anda?</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[var(--text-muted)] dark:text-[var(--text-muted)] text-sm font-medium mb-1.5">Jawaban Keamanan</label>
                    <input type="text" id="reg-jawaban" class="w-full px-4 py-3 border border-gray-200 dark:border-gray-700/60 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#fbbf24]/40 focus:border-[#fbbf24] bg-white/80 dark:bg-gray-800/50 backdrop-blur-sm text-[var(--text-main)] dark:text-[var(--text-main)] placeholder:text-gray-400 transition-all duration-300" placeholder="Jawaban Anda" required>
                </div>
                <div>
                    <label class="block text-[var(--text-muted)] dark:text-[var(--text-muted)] text-sm font-medium mb-1.5">Nama Pengurus (opsional)</label>
                    <input type="text" id="reg-nama_pengurus" class="w-full px-4 py-3 border border-gray-200 dark:border-gray-700/60 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#fbbf24]/40 focus:border-[#fbbf24] bg-white/80 dark:bg-gray-800/50 backdrop-blur-sm text-[var(--text-main)] dark:text-[var(--text-main)] placeholder:text-gray-400 transition-all duration-300" placeholder="Nama pengurus yang Anda kenal">
                </div>
                <div>
                    <label class="block text-[var(--text-muted)] dark:text-[var(--text-muted)] text-sm font-medium mb-1.5">Jabatan (opsional)</label>
                    <input type="text" id="reg-jabatan" class="w-full px-4 py-3 border border-gray-200 dark:border-gray-700/60 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#fbbf24]/40 focus:border-[#fbbf24] bg-white/80 dark:bg-gray-800/50 backdrop-blur-sm text-[var(--text-main)] dark:text-[var(--text-main)] placeholder:text-gray-400 transition-all duration-300" placeholder="Jabatan pengurus tersebut">
                </div>
                <div class="flex items-start gap-3 mt-2">
                    <input type="checkbox" id="reg-commitment" class="mt-1 w-5 h-5 rounded border-gray-300 dark:border-gray-700 text-[#0f2922] focus:ring-[#fbbf24] focus:ring-2 cursor-pointer" required>
                    <label for="reg-commitment" class="text-sm text-[var(--text-muted)] dark:text-[var(--text-muted)] leading-relaxed cursor-pointer">Saya menyatakan berkhidmat untuk organisasi PAC GP Ansor Kapanewon Sewon dan siap mengikuti aturan yang berlaku.</label>
                </div>
                <button type="submit" class="w-full btn-auth py-3 rounded-xl font-semibold text-base bg-gradient-to-r from-[#0f2922] to-[#1a4038] hover:from-[#1a4038] hover:to-[#0f2922] text-white shadow-lg hover:shadow-xl transition-all duration-300 transform hover:-translate-y-0.5 mt-2">Register</button>
                <div id="register-message" class="mt-2 text-center text-sm"></div>
            </form>
        </div>
    </div>

    <!-- ===== MODAL LUPA AKUN ===== -->
    <div id="forgot-account-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 backdrop-blur-sm">
        <div class="bg-white/95 dark:bg-gray-800/90 rounded-2xl shadow-2xl max-w-md w-full p-6 transform scale-95 opacity-0 transition-all duration-300" id="forgot-modal-content">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold text-[#0f2922] dark:text-white font-amiri">Lupa Akun</h2>
                <button id="close-forgot-modal" class="text-gray-400 hover:text-[#0f2922] dark:hover:text-white text-2xl transition-colors">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <!-- Pilihan Mode -->
            <div id="forgot-mode-select" class="mb-4 flex gap-4">
                <label class="flex items-center gap-2 text-sm font-medium text-[var(--text-muted)] dark:text-[var(--text-muted)]">
                    <input type="radio" name="forgotMode" value="password" checked class="text-[#0f2922] focus:ring-[#fbbf24]">
                    Lupa Password
                </label>
                <label class="flex items-center gap-2 text-sm font-medium text-[var(--text-muted)] dark:text-[var(--text-muted)]">
                    <input type="radio" name="forgotMode" value="username" class="text-[#0f2922] focus:ring-[#fbbf24]">
                    Lupa Username
                </label>
            </div>

            <!-- Step 1: Input identifier -->
            <div id="forgot-step-1">
                <p class="text-sm text-[var(--text-muted)] dark:text-[var(--text-muted)] mb-4" id="forgot-step1-desc">Masukkan username atau email Anda. Kami akan menampilkan pertanyaan keamanan.</p>
                <div id="forgot-password-input">
                    <label class="block text-[var(--text-muted)] dark:text-[var(--text-muted)] mb-2 text-sm font-medium">Username / Email</label>
                    <input type="text" id="forgot-username" class="w-full px-4 py-2 border border-gray-200 dark:border-gray-700/60 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#fbbf24]/40 focus:border-[#fbbf24] bg-white/80 dark:bg-gray-800/50 backdrop-blur-sm text-[var(--text-main)] dark:text-[var(--text-main)] placeholder:text-gray-400 transition-all duration-300" placeholder="Masukkan username atau email" required>
                </div>
                <div id="forgot-username-input" class="hidden">
                    <label class="block text-[var(--text-muted)] dark:text-[var(--text-muted)] mb-2 text-sm font-medium">No. HP</label>
                    <input type="text" id="forgot-phone" class="w-full px-4 py-2 border border-gray-200 dark:border-gray-700/60 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#fbbf24]/40 focus:border-[#fbbf24] bg-white/80 dark:bg-gray-800/50 backdrop-blur-sm text-[var(--text-main)] dark:text-[var(--text-main)] placeholder:text-gray-400 transition-all duration-300" placeholder="08xxxxxxxxxx" required>
                </div>
                <button id="forgot-next" class="w-full btn-auth py-2 rounded-lg font-medium mt-3">Lanjut</button>
                <div id="forgot-step1-msg" class="mt-2 text-center text-sm"></div>
            </div>

            <!-- Step 2: Question & Answer -->
            <div id="forgot-step-2" class="hidden">
                <p class="text-sm text-[var(--text-muted)] dark:text-[var(--text-muted)] mb-4">Jawab pertanyaan keamanan berikut:</p>
                <div class="mb-4">
                    <label class="block text-[var(--text-muted)] dark:text-[var(--text-muted)] mb-2 text-sm font-medium">Pertanyaan</label>
                    <p id="forgot-question-text" class="font-medium text-[var(--text-main)] dark:text-[var(--text-main)]"></p>
                </div>
                <div class="mb-4">
                    <label class="block text-[var(--text-muted)] dark:text-[var(--text-muted)] mb-2 text-sm font-medium">Jawaban Anda</label>
                    <input type="text" id="forgot-answer" class="w-full px-4 py-2 border border-gray-200 dark:border-gray-700/60 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#fbbf24]/40 focus:border-[#fbbf24] bg-white/80 dark:bg-gray-800/50 backdrop-blur-sm text-[var(--text-main)] dark:text-[var(--text-main)] placeholder:text-gray-400 transition-all duration-300" placeholder="Jawaban Anda" required>
                </div>
                <button id="forgot-verify" class="w-full btn-auth py-2 rounded-lg font-medium">Verifikasi</button>
                <div id="forgot-step2-msg" class="mt-2 text-center text-sm"></div>
            </div>

            <!-- Step 3: Result -->
            <div id="forgot-step-3" class="hidden">
                <div id="forgot-result-content"></div>
                <button id="forgot-done" class="w-full btn-auth py-2 rounded-lg font-medium mt-3">Selesai</button>
            </div>
        </div>
    </div>
</div>
