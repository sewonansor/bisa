<!-- views/tokoh_admin.html -->
<!-- Halaman Admin: Manajemen Tokoh & Penggerak -->
<!-- Versi: 1.0.0 - Final Fix (Stable, No Error) -->

<div id="main-content">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold text-[var(--text-main)] font-amiri">Manajemen Tokoh</h1>
        <div class="flex gap-2">
            <button id="refresh-btn" class="btn-secondary px-4 py-2 rounded-lg transition shadow-md flex items-center gap-2">
                <i class="fas fa-sync-alt"></i> Refresh
            </button>
            <button id="add-btn" class="btn-primary px-4 py-2 rounded-lg transition shadow-md flex items-center gap-2">
                <i class="fas fa-plus"></i> Tambah Tokoh
            </button>
            <button id="mobile-menu-btn" class="md:hidden text-2xl text-[var(--text-muted)]">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </div>

    <!-- Tabel Daftar Tokoh -->
    <div class="bg-[var(--card-bg)] backdrop-blur-sm rounded-2xl shadow-lg border border-[var(--card-border)] overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full">
                <thead class="bg-[var(--bg-stats)]">
                    <tr>
                        <th class="px-6 py-4 text-left text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider">No</th>
                        <th class="px-6 py-4 text-left text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider">Foto</th>
                        <th class="px-6 py-4 text-left text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider">Nama</th>
                        <th class="px-6 py-4 text-left text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider">Alamat</th>
                        <th class="px-6 py-4 text-left text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider">No HP</th>
                        <th class="px-6 py-4 text-left text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider">Aksi</th>
                    </tr>
                </thead>
                <tbody id="table-body" class="divide-y divide-[var(--card-border)]">
                    <!-- SKELETON LOADING -->
                    <tr id="tokoh-skeleton">
                        <td colspan="6" class="text-center py-8">
                            <div class="skeleton-box h-8 w-3/4 mx-auto mb-2"></div>
                            <div class="skeleton-box h-8 w-1/2 mx-auto"></div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- MODAL TAMBAH / EDIT TOKOH -->
<div id="tokoh-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 backdrop-blur-sm">
    <div class="bg-[var(--card-bg)] rounded-2xl shadow-2xl max-w-2xl w-full p-6 max-h-[90vh] overflow-y-auto transform scale-95 opacity-0 transition-all duration-300">
        <h2 id="modal-title" class="text-2xl font-bold mb-4 text-[var(--text-main)] font-amiri">Tambah Tokoh</h2>
        <form id="tokoh-form">
            <input type="hidden" id="tokoh-id">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-[var(--text-muted)] mb-1">Nama Lengkap</label>
                    <input type="text" id="nama" class="w-full px-3 py-2 border border-[var(--card-border)] rounded-lg focus:outline-none focus:border-[var(--text-main)] bg-[var(--bg-body)] text-[var(--text-main)]" required>
                </div>
                <div>
                    <label class="block text-sm font-medium text-[var(--text-muted)] mb-1">No. HP</label>
                    <input type="text" id="no_hp" class="w-full px-3 py-2 border border-[var(--card-border)] rounded-lg focus:outline-none focus:border-[var(--text-main)] bg-[var(--bg-body)] text-[var(--text-main)]">
                </div>
                <div>
                    <label class="block text-sm font-medium text-[var(--text-muted)] mb-1">Latitude</label>
                    <input type="number" step="any" id="lat" class="w-full px-3 py-2 border border-[var(--card-border)] rounded-lg focus:outline-none focus:border-[var(--text-main)] bg-[var(--bg-body)] text-[var(--text-main)]" placeholder="-7.84">
                </div>
                <div>
                    <label class="block text-sm font-medium text-[var(--text-muted)] mb-1">Longitude</label>
                    <input type="number" step="any" id="lng" class="w-full px-3 py-2 border border-[var(--card-border)] rounded-lg focus:outline-none focus:border-[var(--text-main)] bg-[var(--bg-body)] text-[var(--text-main)]" placeholder="110.36">
                </div>
                <div class="col-span-2">
                    <label class="block text-sm font-medium text-[var(--text-muted)] mb-1">Alamat</label>
                    <input type="text" id="alamat" class="w-full px-3 py-2 border border-[var(--card-border)] rounded-lg focus:outline-none focus:border-[var(--text-main)] bg-[var(--bg-body)] text-[var(--text-main)]">
                </div>
                <div class="col-span-2">
                    <label class="block text-sm font-medium text-[var(--text-muted)] mb-1">Riwayat Hidup</label>
                    <textarea id="riwayat_hidup" rows="3" class="w-full px-3 py-2 border border-[var(--card-border)] rounded-lg focus:outline-none focus:border-[var(--text-main)] bg-[var(--bg-body)] text-[var(--text-main)]"></textarea>
                </div>
                <div class="col-span-2">
                    <label class="block text-sm font-medium text-[var(--text-muted)] mb-1">Pengalaman Organisasi</label>
                    <textarea id="pengalaman_organisasi" rows="3" class="w-full px-3 py-2 border border-[var(--card-border)] rounded-lg focus:outline-none focus:border-[var(--text-main)] bg-[var(--bg-body)] text-[var(--text-main)]"></textarea>
                </div>
                <div class="col-span-2">
                    <label class="block text-sm font-medium text-[var(--text-muted)] mb-1">Detail Lain</label>
                    <textarea id="detail_lain" rows="3" class="w-full px-3 py-2 border border-[var(--card-border)] rounded-lg focus:outline-none focus:border-[var(--text-main)] bg-[var(--bg-body)] text-[var(--text-main)]"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-[var(--text-muted)] mb-1">URL Foto</label>
                    <input type="text" id="foto_url" class="w-full px-3 py-2 border border-[var(--card-border)] rounded-lg focus:outline-none focus:border-[var(--text-main)] bg-[var(--bg-body)] text-[var(--text-main)]" placeholder="https://example.com/foto.jpg">
                </div>
                <div>
                    <label class="block text-sm font-medium text-[var(--text-muted)] mb-1">Atau Upload Foto</label>
                    <input type="file" id="foto_file" accept="image/*" class="w-full px-3 py-2 border border-[var(--card-border)] rounded-lg focus:outline-none focus:border-[var(--text-main)] bg-[var(--bg-body)] text-[var(--text-main)]">
                </div>
            </div>
            <div class="flex justify-end gap-2 mt-4">
                <button type="button" id="modal-close" class="px-4 py-2 bg-gray-300 rounded-lg hover:bg-gray-400 text-[var(--text-main)]">Batal</button>
                <button type="submit" class="px-4 py-2 btn-primary rounded-lg hover:bg-[var(--text-main)]">Simpan</button>
            </div>
        </form>
    </div>
</div>

<!-- SCRIPT INLINE (hanya konfirmasi modul, tidak ada logika loop) -->

<!-- STYLE INLINE (bisa digabung ke CSS global) -->
<style>
    /* Skeleton */
    .skeleton-box {
        background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
        background-size: 200% 100%;
        animation: shimmer 1.8s infinite;
        border-radius: 0.75rem;
    }
    .dark .skeleton-box {
        background: linear-gradient(90deg, #2d3748 25%, #4a5568 50%, #2d3748 75%);
    }
    @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
    }
    /* Tombol secondary (untuk refresh) */
    .btn-secondary {
        background: #f1f5f9;
        color: #1e293b;
        border: 1px solid #e2e8f0;
        border-radius: 0.5rem;
        padding: 0.5rem 1rem;
        font-weight: 500;
        transition: all 0.3s;
    }
    .btn-secondary:hover {
        background: #e2e8f0;
        transform: translateY(-2px);
    }
    .dark .btn-secondary {
        background: rgba(255,255,255,0.05);
        color: #c4b5e0;
        border: 1px solid rgba(128,90,213,0.4);
    }
    .dark .btn-secondary:hover {
        background: rgba(128,90,213,0.2);
        border-color: #a78bfa;
    }
</style>
