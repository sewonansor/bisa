<!-- views/tokoh_admin.html -->
<!-- Halaman Admin: Manajemen Tokoh & Penggerak -->
<!-- Logic: js/tokoh_admin.js | Route: /tokoh_admin -->
<!-- Versi: 3.0.0 — FULL FIX (All menus working, no errors) -->

<div id="main-content">
    <!-- ============================================================ -->
    <!-- HEADER                                                        -->
    <!-- ============================================================ -->
    <div class="flex flex-wrap justify-between items-center mb-6 gap-4">
        <h1 class="text-3xl font-bold text-[var(--text-main)] font-amiri">
            <i class="fas fa-user-tie mr-2"></i>
            Manajemen Tokoh
        </h1>
        <div class="flex flex-wrap gap-2">
            <button id="refresh-btn" type="button"
                    class="btn-secondary px-4 py-2 rounded-lg flex items-center gap-2">
                <i class="fas fa-sync-alt"></i>
                <span class="hidden sm:inline">Refresh</span>
            </button>
            <button id="add-btn" type="button"
                    class="btn-primary px-4 py-2 rounded-lg flex items-center gap-2">
                <i class="fas fa-plus"></i>
                <span>Tambah Tokoh</span>
            </button>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- TABEL TOKOH                                                   -->
    <!-- ============================================================ -->
    <div class="table-wrapper">
        <div class="overflow-x-auto">
            <table class="w-full">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Foto</th>
                        <th>Nama</th>
                        <th>Alamat</th>
                        <th>No HP</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="table-body" class="divide-y divide-[var(--card-border)]">
                    <!-- SKELETON LOADING -->
                    <tr id="tokoh-skeleton">
                        <td colspan="6" class="text-center py-8">
                            <i class="fas fa-spinner fa-spin text-2xl text-[var(--text-muted)]"></i>
                            <p class="text-[var(--text-muted)] text-sm mt-2">Memuat data tokoh...</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- ============================================================ -->
<!-- MODAL: TAMBAH / EDIT TOKOH                                    -->
<!-- ============================================================ -->
<div id="tokoh-modal"
     class="fixed inset-0 bg-black/50 hidden items-center justify-center z-[9999] backdrop-blur-sm p-4">
    <div id="tokoh-modal-content"
         class="bg-[var(--card-bg)] rounded-2xl shadow-2xl max-w-2xl w-full p-6 max-h-[90vh] overflow-y-auto transform scale-95 opacity-0 transition-all duration-300">

        <h2 id="modal-title"
            class="text-2xl font-bold mb-4 text-[var(--text-main)] font-amiri">
            Tambah Tokoh
        </h2>

        <form id="tokoh-form" class="space-y-4">
            <input type="hidden" id="tokoh-id">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-[var(--text-muted)] mb-2">
                        Nama Lengkap <span class="text-red-500">*</span>
                    </label>
                    <input type="text" id="nama"
                           class="form-input"
                           placeholder="Nama lengkap tokoh"
                           required>
                </div>

                <div>
                    <label class="block text-sm font-medium text-[var(--text-muted)] mb-2">
                        No. HP
                    </label>
                    <input type="text" id="no_hp"
                           class="form-input"
                           placeholder="08xxxxxxxxxx">
                </div>

                <div>
                    <label class="block text-sm font-medium text-[var(--text-muted)] mb-2">
                        Latitude
                    </label>
                    <input type="number" step="any" id="lat"
                           class="form-input"
                           placeholder="-7.84">
                </div>

                <div>
                    <label class="block text-sm font-medium text-[var(--text-muted)] mb-2">
                        Longitude
                    </label>
                    <input type="number" step="any" id="lng"
                           class="form-input"
                           placeholder="110.36">
                </div>

                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-[var(--text-muted)] mb-2">
                        Alamat
                    </label>
                    <input type="text" id="alamat"
                           class="form-input"
                           placeholder="Contoh: Panggungharjo, Sewon, Bantul">
                </div>

                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-[var(--text-muted)] mb-2">
                        Riwayat Hidup
                    </label>
                    <textarea id="riwayat_hidup" rows="3"
                              class="form-input"
                              placeholder="Riwayat hidup tokoh"></textarea>
                </div>

                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-[var(--text-muted)] mb-2">
                        Pengalaman Organisasi
                    </label>
                    <textarea id="pengalaman_organisasi" rows="3"
                              class="form-input"
                              placeholder="Pengalaman organisasi"></textarea>
                </div>

                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-[var(--text-muted)] mb-2">
                        Detail Lain
                    </label>
                    <textarea id="detail_lain" rows="3"
                              class="form-input"
                              placeholder="Detail informasi tambahan"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-[var(--text-muted)] mb-2">
                        URL Foto
                    </label>
                    <input type="text" id="foto_url"
                           class="form-input"
                           placeholder="https://example.com/foto.jpg">
                </div>

                <div>
                    <label class="block text-sm font-medium text-[var(--text-muted)] mb-2">
                        Atau Upload Foto
                    </label>
                    <input type="file" id="foto_file"
                           accept="image/*"
                           class="form-input">
                    <p class="text-xs text-[var(--text-muted)] mt-1">
                        <i class="fas fa-info-circle mr-1"></i>
                        Max 5 MB. File akan diupload ke Google Drive.
                    </p>
                </div>

                <!-- FOTO PREVIEW (STATIC, tidak dibuat JS) -->
                <div class="md:col-span-2" id="foto-preview-wrap" style="display:none;">
                    <p class="text-xs text-[var(--text-muted)] mb-1">Preview:</p>
                    <img id="foto-preview-img"
                         src="" alt="Preview"
                         class="w-20 h-20 rounded-lg object-cover border border-[var(--card-border)]">
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-2">
                <button type="button" id="modal-close"
                        class="btn-secondary px-4 py-2 rounded-lg">
                    Batal
                </button>
                <button type="submit"
                        class="btn-primary px-4 py-2 rounded-lg">
                    <i class="fas fa-save mr-2"></i>
                    <span>Simpan</span>
                </button>
            </div>
        </form>
    </div>
</div>

    /* Foto preview — hidden by default, JS toggle via style.display */

    }
    #foto-preview-wrap.active {
        display: block;
    }

    /* Responsive modal padding */
    @media (max-width: 640px) {
        #tokoh-modal-content {
            padding: 1rem;
        }
    }
</style>
