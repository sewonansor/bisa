<!-- views/arsip_admin.html -->
<!-- Halaman Admin: Manajemen Arsip Digital -->
<!-- Logic: js/arsip_admin.js | Route: /arsip_admin -->
<!-- Versi: 2.0.0 — CSS common sudah di css/style.css -->

<div id="main-content">
    <!-- ============================================================ -->
    <!-- HEADER                                                        -->
    <!-- ============================================================ -->
    <div class="flex flex-wrap justify-between items-center mb-6 gap-4">
        <h1 class="text-3xl font-bold text-[var(--text-main)] font-amiri">
            <i class="fas fa-archive mr-2"></i>
            Manajemen Arsip Digital
        </h1>
        <div class="flex flex-wrap gap-2">
            <button id="refresh-arsip-btn"
                    class="btn-secondary px-4 py-2 rounded-lg flex items-center gap-2">
                <i class="fas fa-sync-alt"></i>
                <span class="hidden sm:inline">Refresh</span>
            </button>
            <button id="add-arsip-btn"
                    class="btn-primary px-4 py-2 rounded-lg flex items-center gap-2">
                <i class="fas fa-plus"></i>
                <span>Tambah Arsip</span>
            </button>
            <button id="mobile-menu-btn"
                    class="md:hidden text-2xl text-[var(--text-muted)]"
                    aria-label="Buka Menu">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- TABEL ARSIP                                                   -->
    <!-- ============================================================ -->
    <div class="table-wrapper">
        <div class="overflow-x-auto">
            <table class="w-full">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Judul</th>
                        <th>Tahun</th>
                        <th>Kategori</th>
                        <th>Jenis</th>
                        <th>Deskripsi</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="arsip-table-body" class="divide-y divide-[var(--card-border)]">
                    <!-- SKELETON LOADING -->
                    <tr id="arsip-skeleton">
                        <td colspan="7" class="text-center py-8">
                            <i class="fas fa-spinner fa-spin text-2xl text-[var(--text-muted)]"></i>
                            <p class="text-[var(--text-muted)] text-sm mt-2">Memuat data arsip...</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- ============================================================ -->
<!-- MODAL: TAMBAH / EDIT ARSIP                                    -->
<!-- ============================================================ -->
<div id="arsip-modal"
     class="fixed inset-0 bg-black/50 hidden items-center justify-center z-[9999] backdrop-blur-sm p-4">
    <div id="modal-content"
         class="bg-[var(--card-bg)] rounded-2xl shadow-2xl max-w-2xl w-full p-6 transform scale-95 opacity-0 transition-all duration-300 max-h-[90vh] overflow-y-auto">

        <h2 id="modal-title"
            class="text-2xl font-bold mb-4 text-[var(--text-main)] font-amiri">
            Tambah Arsip
        </h2>

        <form id="arsip-form" class="space-y-4">
            <input type="hidden" id="arsip-id">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                        Judul <span class="text-red-500">*</span>
                    </label>
                    <input type="text" id="arsip_judul"
                           class="form-input"
                           placeholder="Contoh: AD/ART Ansor 2026"
                           required>
                </div>

                <div>
                    <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                        Tahun <span class="text-red-500">*</span>
                    </label>
                    <input type="text" id="arsip_tahun"
                           class="form-input"
                           placeholder="Contoh: 2026"
                           required>
                </div>

                <div>
                    <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                        Kategori <span class="text-red-500">*</span>
                    </label>
                    <select id="arsip_kategori" class="form-input" required>
                        <option value="dokumen">Dokumen</option>
                        <option value="laporan">Laporan</option>
                        <option value="foto">Foto</option>
                        <option value="video">Video</option>
                        <option value="lainnya">Lainnya</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                        Jenis File <span class="text-red-500">*</span>
                    </label>
                    <select id="arsip_jenis" class="form-input" required>
                        <option value="pdf">PDF</option>
                        <option value="docx">DOCX</option>
                        <option value="xlsx">XLSX</option>
                        <option value="img">Gambar</option>
                        <option value="video">Video</option>
                        <option value="other">Lainnya</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                    File URL
                </label>
                <input type="text" id="arsip_file_url"
                       class="form-input"
                       placeholder="Link file (opsional)">
                <p class="text-xs text-[var(--text-muted)] mt-1">
                    Bisa juga upload file di bawah ini (otomatis terisi).
                </p>
            </div>

            <div>
                <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                    Deskripsi <span class="text-red-500">*</span>
                </label>
                <textarea id="arsip_deskripsi" rows="3"
                          class="form-input"
                          placeholder="Deskripsi singkat arsip"
                          required></textarea>
            </div>

            <div class="flex justify-end gap-2 pt-2">
                <button type="button" id="modal-close"
                        class="btn-secondary px-4 py-2 rounded-lg">
                    Batal
                </button>
                <button type="submit"
                        class="btn-primary px-4 py-2 rounded-lg">
                    <i class="fas fa-save mr-2"></i>
                    <span>Simpan</span>
                </button>
            </div>
        </form>
    </div>
</div>

<!-- ============================================================ -->
<!-- SCRIPT INLINE — Konfirmasi saja (no emoji)                    -->
<!-- ============================================================ -->
<script>
    (function() {
        console.log('[View] arsip_admin.html loaded — logic handled by js/arsip_admin.js');
    })();
</script>

<!-- STYLE INLINE — Khusus view arsip_admin saja                   -->
<!-- Common styles (btn-primary, btn-secondary, form-input, table) -->
<!-- sudah di-load dari css/style.css                              -->
<!-- ============================================================ -->
<style>
    /* View tidak butuh CSS khusus — semua pakai style.css.
       JS akan auto-inject:
       - arsip-stats (4 kartu)
       - arsip-search-wrap (search + filter + export)
       - arsip-bulk-bar (bulk actions)
       - arsip-upload-preview (upload file)
       - arsip-detail-modal (preview)
       - arsip_file (file input) */

    /* ────────────── RESPONSIVE ────────────── */
    @media (max-width: 640px) {
        #arsip-modal .grid-cols-1 {
            grid-template-columns: 1fr;
        }
    }
</style>
