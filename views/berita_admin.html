<!-- views/berita_admin.html -->
<!-- Halaman Admin: Manajemen Berita -->
<!-- Versi: 1.0.0 - Final (Tabel, Modal, Responsif) -->

<div id="main-content">
    <!-- Header -->
    <div class="flex flex-wrap justify-between items-center mb-6 gap-4">
        <h1 class="text-3xl font-bold text-[var(--text-main)] font-amiri">Manajemen Berita</h1>
        <div class="flex gap-2">
            <button id="refresh-btn" class="btn-secondary px-4 py-2 rounded-lg transition shadow-md flex items-center gap-2">
                <i class="fas fa-sync-alt"></i> Refresh
            </button>
            <button id="add-btn" class="btn-primary px-4 py-2 rounded-lg transition shadow-md flex items-center gap-2">
                <i class="fas fa-plus"></i> Tambah Berita
            </button>
            <button id="mobile-menu-btn" class="md:hidden text-2xl text-[var(--text-muted)]">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </div>

    <!-- Tabel Berita -->
    <div class="bg-[var(--card-bg)] backdrop-blur-sm rounded-2xl shadow-lg border border-[var(--card-border)] overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full">
                <thead class="bg-[var(--bg-stats)]">
                    <tr>
                        <th class="px-6 py-4 text-left text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider">No</th>
                        <th class="px-6 py-4 text-left text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider">Judul</th>
                        <th class="px-6 py-4 text-left text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider">Tanggal</th>
                        <th class="px-6 py-4 text-left text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider">Tag</th>
                        <th class="px-6 py-4 text-left text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider">Gambar</th>
                        <th class="px-6 py-4 text-left text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider">Aksi</th>
                    </tr>
                </thead>
                <tbody id="berita-table" class="divide-y divide-[var(--card-border)]">
                    <!-- Akan diisi oleh JavaScript -->
                    <tr><td colspan="6" class="text-center py-4 text-[var(--text-muted)]">Memuat data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal Tambah/Edit Berita -->
<div id="berita-modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 backdrop-blur-sm">
    <div class="bg-[var(--card-bg)] rounded-2xl shadow-2xl max-w-2xl w-full p-6 transform scale-95 opacity-0 transition-all duration-300">
        <h2 id="modal-title" class="text-2xl font-bold mb-4 text-[var(--text-main)] font-amiri">Tambah Berita</h2>
        <form id="berita-form" class="space-y-4">
            <input type="hidden" id="berita-id">
            <div>
                <label class="block text-[var(--text-muted)] mb-1 text-sm font-medium">Judul Berita</label>
                <input type="text" id="judul" class="w-full px-4 py-2 border border-[var(--card-border)] rounded-lg focus:outline-none focus:border-[var(--text-main)] bg-[var(--bg-body)] text-[var(--text-main)]" required>
            </div>
            <div>
                <label class="block text-[var(--text-muted)] mb-1 text-sm font-medium">Tag (Opsional)</label>
                <input type="text" id="tag" class="w-full px-4 py-2 border border-[var(--card-border)] rounded-lg focus:outline-none focus:border-[var(--text-main)] bg-[var(--bg-body)] text-[var(--text-main)]" placeholder="contoh: kegiatan, pengumuman">
            </div>
            <div>
                <label class="block text-[var(--text-muted)] mb-1 text-sm font-medium">Isi Berita</label>
                <textarea id="isi" rows="6" class="w-full px-4 py-2 border border-[var(--card-border)] rounded-lg focus:outline-none focus:border-[var(--text-main)] bg-[var(--bg-body)] text-[var(--text-main)]" required></textarea>
            </div>
            <div>
                <label class="block text-[var(--text-muted)] mb-1 text-sm font-medium">Gambar URL (Opsional)</label>
                <input type="text" id="gambar_url" class="w-full px-4 py-2 border border-[var(--card-border)] rounded-lg focus:outline-none focus:border-[var(--text-main)] bg-[var(--bg-body)] text-[var(--text-main)]" placeholder="https://example.com/gambar.jpg">
                <p class="text-xs text-[var(--text-muted)] mt-1">Jika kosong, gambar pertama dari isi berita akan dijadikan thumbnail.</p>
            </div>
            <div>
                <label class="block text-[var(--text-muted)] mb-1 text-sm font-medium">Tanggal</label>
                <input type="date" id="tanggal" class="w-full px-4 py-2 border border-[var(--card-border)] rounded-lg focus:outline-none focus:border-[var(--text-main)] bg-[var(--bg-body)] text-[var(--text-main)]" required>
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button type="button" id="close-btn" class="px-4 py-2 bg-gray-300 rounded-lg hover:bg-gray-400 text-[var(--text-main)]">Batal</button>
                <button type="submit" id="save-btn" class="px-4 py-2 btn-primary rounded-lg hover:bg-[var(--text-main)]">Simpan</button>
            </div>
        </form>
    </div>
</div>

<!-- SCRIPT INLINE (hanya konfirmasi, modul dipanggil via App.run) -->
<script>
    console.log('berita_admin view loaded');
</script>

        transition: all 0.3s;
    }
    .btn-secondary:hover {
        background: #e2e8f0;
