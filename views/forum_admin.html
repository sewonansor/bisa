<!-- views/forum_admin.html -->
<!-- Halaman Admin: Manajemen Forum Diskusi & Komentar -->
<!-- Logic: js/forum_admin.js | Route: /forum_admin -->
<!-- Versi: 2.0.0 — CSS common sudah di css/style.css -->

<div id="main-content">
    <!-- ============================================================ -->
    <!-- HEADER                                                        -->
    <!-- ============================================================ -->
    <div class="flex flex-wrap justify-between items-center mb-6 gap-4">
        <h1 class="text-3xl font-bold text-[var(--text-main)] font-amiri">
            <i class="fas fa-comments mr-2"></i>
            Manajemen Forum Diskusi
        </h1>
        <div class="flex flex-wrap gap-2">
            <button id="refresh-forum-btn"
                    class="btn-secondary px-4 py-2 rounded-lg flex items-center gap-2">
                <i class="fas fa-sync-alt"></i>
                <span class="hidden sm:inline">Refresh</span>
            </button>
            <button id="add-btn"
                    class="btn-primary px-4 py-2 rounded-lg flex items-center gap-2">
                <i class="fas fa-plus"></i>
                <span>Tambah Topik</span>
            </button>
            <button id="mobile-menu-btn"
                    class="md:hidden text-2xl text-[var(--text-muted)]"
                    aria-label="Buka Menu">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- RINGKASAN STATISTIK                                           -->
    <!-- ============================================================ -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
        <div class="stat-card p-4 rounded-xl bg-[var(--card-bg)] backdrop-blur-sm border border-[var(--card-border)]">
            <p class="text-xs sm:text-sm text-[var(--text-muted)] font-medium uppercase tracking-wider">
                Total Topik
            </p>
            <p class="text-2xl font-bold text-[var(--text-main)] mt-1" id="total-topik">0</p>
        </div>
        <div class="stat-card p-4 rounded-xl bg-[var(--card-bg)] backdrop-blur-sm border border-[var(--card-border)]">
            <p class="text-xs sm:text-sm text-[var(--text-muted)] font-medium uppercase tracking-wider">
                Total Komentar
            </p>
            <p class="text-2xl font-bold text-blue-600 mt-1" id="total-komentar">0</p>
        </div>
        <div class="stat-card p-4 rounded-xl bg-[var(--card-bg)] backdrop-blur-sm border border-[var(--card-border)]">
            <p class="text-xs sm:text-sm text-[var(--text-muted)] font-medium uppercase tracking-wider">
                Topik Terakhir
            </p>
            <p class="text-lg font-bold text-[var(--text-main)] mt-1" id="topik-terakhir">-</p>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- DAFTAR TOPIK FORUM                                            -->
    <!-- ============================================================ -->
    <div id="forum-container" class="space-y-6">
        <!-- Loading placeholder -->
        <div class="recent-card text-center py-8">
            <i class="fas fa-spinner fa-spin text-2xl text-[var(--text-muted)]"></i>
            <p class="text-[var(--text-muted)] mt-2">Memuat data forum...</p>
        </div>
    </div>
</div>

<!-- ============================================================ -->
<!-- MODAL: TAMBAH / EDIT TOPIK                                    -->
<!-- ============================================================ -->
<div id="topic-modal"
     class="fixed inset-0 bg-black/50 hidden items-center justify-center z-[9999] backdrop-blur-sm p-4">
    <div id="modal-content"
         class="bg-[var(--card-bg)] rounded-2xl shadow-2xl max-w-md w-full p-6 transform scale-95 opacity-0 transition-all duration-300 max-h-[90vh] overflow-y-auto">

        <h2 id="modal-title"
            class="text-2xl font-bold mb-4 text-[var(--text-main)] font-amiri">
            Tambah Topik
        </h2>

        <form id="topic-form" class="space-y-4">
            <input type="hidden" id="edit-id">

            <div>
                <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                    Judul Topik <span class="text-red-500">*</span>
                </label>
                <input type="text" id="topic_judul"
                       class="form-input"
                       placeholder="Judul topik diskusi"
                       required>
            </div>

            <div>
                <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                    Isi Topik <span class="text-red-500">*</span>
                </label>
                <textarea id="topic_isi" rows="4"
                          class="form-input"
                          placeholder="Tulis isi topik diskusi di sini..."
                          required></textarea>
            </div>

            <div class="flex justify-end gap-2 pt-2">
                <button type="button" id="modal-close"
                        class="btn-secondary px-4 py-2 rounded-lg">
                    Batal
                </button>
                <button type="submit"
                        class="btn-primary px-4 py-2 rounded-lg">
                    <i class="fas fa-save mr-2"></i>
                    <span>Simpan</span>
                </button>
            </div>
        </form>
    </div>
</div>

<!-- ============================================================ -->
<!-- SCRIPT INLINE — Konfirmasi saja (no emoji)                    -->
<!-- ============================================================ -->
<script>
    (function() {
        console.log('[View] forum_admin.html loaded — logic handled by js/forum_admin.js');
    })();
</script>

<!-- ============================================================ -->
<!-- STYLE INLINE — Khusus view forum_admin saja                   -->
<!-- Common styles (stat-card, btn-*, form-input) sudah di         -->
<!-- css/style.css                                                 -->
<!-- ============================================================ -->
<style>
    /* ────────────── TOPIC CARD ────────────── */
    .topic-card {
        transition: all 0.2s ease;
    }

    /* ────────────── COMMENT ITEM ────────────── */
    .comment-item {
        border-left: 3px solid var(--card-border);
        padding-left: 1rem;
    }

    /* ────────────── RECENT CARD (loading placeholder) ────────────── */
    .recent-card {
        background: var(--card-bg);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid var(--card-border);
        border-radius: 1rem;
        padding: 1.25rem;
    }
</style>
