<!-- views/surat_member.html -->
<!-- Fragment Manajemen Surat untuk Member -->
<!-- Versi: 2.0.0 - Final Fix (Nomor Otomatis, Tombol Preview) -->

<!-- Konten Utama -->
<div id="member-frame-content">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold text-[var(--text-main)] font-amiri">Surat Menyurat</h1>
        <div class="flex gap-2">
            <button id="refresh-surat-btn" class="btn-secondary px-4 py-2 rounded-lg transition shadow-md flex items-center gap-2">
                <i class="fas fa-sync-alt"></i> Refresh
            </button>
            <button id="add-surat-btn" class="btn-primary flex items-center gap-2">
                <i class="fas fa-plus"></i> Tambah Surat
            </button>
        </div>
    </div>

    <!-- Tabel Surat -->
    <div class="bg-[var(--card-bg)] backdrop-blur-sm rounded-2xl shadow-lg border border-[var(--card-border)] overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full">
                <thead class="bg-[var(--bg-stats)]">
                    <tr>
                        <th class="px-6 py-4 text-left text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider">No</th>
                        <th class="px-6 py-4 text-left text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider">Nomor Surat</th>
                        <th class="px-6 py-4 text-left text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider">Perihal</th>
                        <th class="px-6 py-4 text-left text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider">Tanggal</th>
                        <th class="px-6 py-4 text-left text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider">Pengirim</th>
                        <th class="px-6 py-4 text-left text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider">Penerima</th>
                        <th class="px-6 py-4 text-left text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider">Lampiran</th>
                        <th class="px-6 py-4 text-left text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider">Aksi</th>
                    </tr>
                </thead>
                <tbody id="surat-table-body" class="divide-y divide-[var(--card-border)]">
                    <!-- Skeleton Loading -->
                    <tr id="surat-skeleton">
                        <td colspan="8" class="text-center py-8">
                            <div class="skeleton-box h-8 w-3/4 mx-auto mb-2"></div>
                            <div class="skeleton-box h-8 w-1/2 mx-auto"></div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- MODAL TAMBAH / EDIT SURAT -->
<div id="surat-modal" class="fixed inset-0 z-50 hidden items-center justify-center">
    <div class="absolute inset-0 bg-black/50 backdrop-blur-sm"></div>
    <div class="bg-[var(--card-bg)] rounded-2xl shadow-2xl max-w-2xl w-full p-6 mx-4 modal-content" id="modal-content">
        <h2 class="text-2xl font-bold mb-4 text-[var(--text-main)] font-amiri" id="modal-title">Tambah Surat</h2>
        <form id="surat-form">
            <input type="hidden" id="surat-id">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="mb-4">
                    <label class="block text-[var(--text-muted)] mb-2">Nomor Surat (Otomatis)</label>
                    <input type="text" id="nomor_surat" class="w-full px-4 py-2 border border-[var(--card-border)] rounded-lg focus:outline-none focus:border-[var(--text-main)] bg-[var(--bg-body)] text-[var(--text-main)]" placeholder="Otomatis dibuat sistem" disabled>
                </div>
                <div class="mb-4">
                    <label class="block text-[var(--text-muted)] mb-2">Jenis Surat</label>
                    <select id="jenis_surat" class="w-full px-4 py-2 border border-[var(--card-border)] rounded-lg focus:outline-none focus:border-[var(--text-main)] bg-[var(--bg-body)] text-[var(--text-main)]">
                        <option value="internal">Internal (SR-01)</option>
                        <option value="eksternal">Eksternal (SR-02)</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-[var(--text-muted)] mb-2">Perihal</label>
                    <input type="text" id="perihal" class="w-full px-4 py-2 border border-[var(--card-border)] rounded-lg focus:outline-none focus:border-[var(--text-main)] bg-[var(--bg-body)] text-[var(--text-main)]" required>
                </div>
                <div class="mb-4">
                    <label class="block text-[var(--text-muted)] mb-2">Tanggal</label>
                    <input type="date" id="tanggal" class="w-full px-4 py-2 border border-[var(--card-border)] rounded-lg focus:outline-none focus:border-[var(--text-main)] bg-[var(--bg-body)] text-[var(--text-main)]" required>
                </div>
                <div class="mb-4">
                    <label class="block text-[var(--text-muted)] mb-2">Pengirim</label>
                    <input type="text" id="pengirim" class="w-full px-4 py-2 border border-[var(--card-border)] rounded-lg focus:outline-none focus:border-[var(--text-main)] bg-[var(--bg-body)] text-[var(--text-main)]" required>
                </div>
                <div class="mb-4">
                    <label class="block text-[var(--text-muted)] mb-2">Penerima</label>
                    <input type="text" id="penerima" class="w-full px-4 py-2 border border-[var(--card-border)] rounded-lg focus:outline-none focus:border-[var(--text-main)] bg-[var(--bg-body)] text-[var(--text-main)]" required>
                </div>
            </div>
            <div class="mb-4">
                <label class="block text-[var(--text-muted)] mb-2">Lampiran (URL)</label>
                <input type="text" id="lampiran" class="w-full px-4 py-2 border border-[var(--card-border)] rounded-lg focus:outline-none focus:border-[var(--text-main)] bg-[var(--bg-body)] text-[var(--text-main)]" placeholder="URL dokumen (opsional)">
            </div>
            <div class="mb-4">
                <label class="block text-[var(--text-muted)] mb-2">Upload File Lampiran (gambar/dokumen)</label>
                <input type="file" id="surat_file" class="w-full px-4 py-2 border border-[var(--card-border)] rounded-lg focus:outline-none focus:border-[var(--text-main)] bg-[var(--bg-body)] text-[var(--text-main)]">
                <p class="text-xs text-[var(--text-muted)] mt-1">File akan diunggah ke Google Drive dan URL otomatis terisi ke lampiran.</p>
            </div>
            <div class="mb-4">
                <label class="block text-[var(--text-muted)] mb-2">Isi Surat</label>
                <textarea id="isi" rows="4" class="w-full px-4 py-2 border border-[var(--card-border)] rounded-lg focus:outline-none focus:border-[var(--text-main)] bg-[var(--bg-body)] text-[var(--text-main)]" required></textarea>
            </div>
            <div class="flex justify-end gap-2 mt-4">
                <button type="button" id="modal-close" class="px-4 py-2 bg-gray-300 rounded-lg hover:bg-gray-400 text-[var(--text-main)]">Batal</button>
                <button type="submit" class="btn-primary">Simpan</button>
            </div>
        </form>
    </div>
</div>

<!-- STYLE INLINE (bisa digabung ke CSS global) -->
<style>
    /* Skeleton */
    .skeleton-box {
        background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
        background-size: 200% 100%;
        animation: shimmer 1.8s infinite;
        border-radius: 0.75rem;
    }
    .dark .skeleton-box {
        background: linear-gradient(90deg, #2d3748 25%, #4a5568 50%, #2d3748 75%);
    }
    @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
    }
    /* Tombol secondary (untuk refresh) */
    .btn-secondary {
        background: #f1f5f9;
        color: #1e293b;
        border: 1px solid #e2e8f0;
        border-radius: 0.5rem;
        padding: 0.5rem 1rem;
        font-weight: 500;
        transition: all 0.3s;
    }
    .btn-secondary:hover {
        background: #e2e8f0;
        transform: translateY(-2px);
    }
    .dark .btn-secondary {
        background: rgba(255,255,255,0.05);
        color: #c4b5e0;
        border: 1px solid rgba(128,90,213,0.4);
    }
    .dark .btn-secondary:hover {
        background: rgba(128,90,213,0.2);
        border-color: #a78bfa;
    }
</style>
