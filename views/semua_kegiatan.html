<!-- STYLE INLINE — Khusus view semua_kegiatan saja                -->
<!-- Common styles (skeleton-box, dst.) sudah di css/style.css     -->
<!-- ============================================================ -->
<style>
    /* ────────────── HERO ────────────── */
    .semua-kegiatan-hero {
        background: linear-gradient(135deg, #0f2922 0%, #1a3c34 50%, #0f2922 100%);
        position: relative;
        overflow: hidden;
    }
    .semua-kegiatan-hero::before {
        content: '';
        position: absolute;
        top: -30%;
        right: -15%;
        width: 500px;
        height: 500px;
        background: radial-gradient(circle, rgba(251, 191, 36, 0.15), transparent 70%);
        border-radius: 50%;
        pointer-events: none;
    }
    .semua-kegiatan-hero::after {
        content: '';
        position: absolute;
        bottom: -30%;
        left: -15%;
        width: 400px;
        height: 400px;
        background: radial-gradient(circle, rgba(22, 163, 74, 0.2), transparent 70%);
        border-radius: 50%;
        pointer-events: none;
    }

    /* ────────────── KEGIATAN CARD ────────────── */
    .kegiatan-card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 1rem;
        overflow: hidden;
        transition: transform 0.3s ease,
                    box-shadow 0.3s ease,
                    border-color 0.3s ease;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        display: block;
        text-decoration: none;
        will-change: transform, box-shadow;
    }
    .kegiatan-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
        border-color: var(--text-main);
    }

    /* ────────────── CARD IMG WRAPPER (regular) ────────────── */
    .kegiatan-card .img-wrapper {
        height: 200px;
        overflow: hidden;
        background: var(--bg-stats);
        position: relative;
    }
    .kegiatan-card .img-wrapper img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.5s ease;
    }
    .kegiatan-card:hover .img-wrapper img {
        transform: scale(1.05);
    }

    /* ────────────── FEATURED CARD IMAGE (lebih tinggi) ────────────── */
    .kegiatan-featured .img-wrapper {
        height: 280px;
    }
    .kegiatan-featured .img-wrapper img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.5s ease;
    }
    .kegiatan-featured:hover .img-wrapper img {
        transform: scale(1.05);
    }

    /* ────────────── RESPONSIVE ────────────── */
    @media (max-width: 640px) {
        .semua-kegiatan-hero h1 {
            font-size: 1.75rem !important;
        }
        .kegiatan-card .img-wrapper,
        .kegiatan-featured .img-wrapper {
            height: 200px;
        }
    }
</style>
