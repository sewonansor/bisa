<!-- views/dashboard_member.html -->
<!-- Dashboard Member - Ringkasan Aktivitas Pribadi -->
<!-- Logic: js/dashboard_member.js | Route: /dashboard_member -->
<!-- Versi: 2.0.0 — FIX: Sebelumnya berisi JS, sekarang HTML murni -->

<div id="dashboard-wrapper">
    <!-- ============================================================ -->
    <!-- HEADER: Greeting + Refresh                                    -->
    <!-- ============================================================ -->
    <div class="flex flex-wrap justify-between items-center mb-6 gap-4">
        <div>
            <h1 class="text-3xl font-bold text-[var(--text-main)] font-amiri flex items-center gap-2">
                <i class="fas fa-chart-pie text-[#0f2922] dark:text-[#fbbf24]"></i>
                Dashboard Member
            </h1>
            <p class="text-sm text-[var(--text-muted)] mt-1">
                <i class="far fa-calendar-alt mr-1"></i>
                <span id="dashboard-member-date-info">Ringkasan aktivitas Anda</span>
            </p>
        </div>
        <div class="flex items-center gap-3 flex-wrap">
            <button id="refresh-member-btn"
                    class="btn-primary px-4 py-2 rounded-lg flex items-center gap-2 text-sm font-medium">
                <i class="fas fa-sync-alt"></i>
                <span>Refresh Data</span>
            </button>
            <button id="mobile-menu-btn"
                    class="md:hidden text-2xl text-[var(--text-muted)] hover:text-[var(--text-main)] transition"
                    aria-label="Buka Menu">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- SKELETON (hidden by default, JS akan toggle)                  -->
    <!-- ============================================================ -->
    <div id="member-skeleton" class="hidden">
        <!-- Stats 4 kartu -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
            <div class="premium-card p-4 rounded-xl border border-[var(--card-border)]">
                <div class="skeleton-box h-10 w-10 rounded-full mb-3"></div>
                <div class="skeleton-box h-3 w-2/3 mb-2"></div>
                <div class="skeleton-box h-8 w-1/2"></div>
            </div>
            <div class="premium-card p-4 rounded-xl border border-[var(--card-border)]">
                <div class="skeleton-box h-10 w-10 rounded-full mb-3"></div>
                <div class="skeleton-box h-3 w-2/3 mb-2"></div>
                <div class="skeleton-box h-8 w-1/2"></div>
            </div>
            <div class="premium-card p-4 rounded-xl border border-[var(--card-border)]">
                <div class="skeleton-box h-10 w-10 rounded-full mb-3"></div>
                <div class="skeleton-box h-3 w-2/3 mb-2"></div>
                <div class="skeleton-box h-8 w-1/2"></div>
            </div>
            <div class="premium-card p-4 rounded-xl border border-[var(--card-border)]">
                <div class="skeleton-box h-10 w-10 rounded-full mb-3"></div>
                <div class="skeleton-box h-3 w-2/3 mb-2"></div>
                <div class="skeleton-box h-8 w-1/2"></div>
            </div>
        </div>

        <!-- Recent lists -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="recent-card">
                <div class="skeleton-box h-6 w-1/2 mb-4"></div>
                <div class="skeleton-box h-14 w-full mb-3"></div>
                <div class="skeleton-box h-14 w-full mb-3"></div>
                <div class="skeleton-box h-14 w-full"></div>
            </div>
            <div class="recent-card">
                <div class="skeleton-box h-6 w-1/2 mb-4"></div>
                <div class="skeleton-box h-14 w-full mb-3"></div>
                <div class="skeleton-box h-14 w-full mb-3"></div>
                <div class="skeleton-box h-14 w-full"></div>
            </div>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- KONTEN (JS akan render greeting, quick actions, stats, recent) -->
    <!-- ============================================================ -->
    <div id="member-dashboard-content">
        <div class="text-center py-12">
            <i class="fas fa-spinner fa-spin text-3xl text-[var(--text-main)]"></i>
            <p class="text-[var(--text-muted)] mt-3">Memuat dashboard...</p>
        </div>
    </div>
</div>

<!-- ============================================================ -->
<!-- SCRIPT INLINE — Konfirmasi saja (no emoji)                    -->
<!-- ============================================================ -->
<script>
    (function() {
        console.log('[View] dashboard_member.html loaded — logic handled by js/dashboard_member.js');

        const dateInfo = document.getElementById('dashboard-member-date-info');
        if (dateInfo) {
            const now = new Date();
            const opts = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
            dateInfo.textContent = now.toLocaleDateString('id-ID', opts);
        }
    })();
</script>

<!-- ============================================================ -->
<!-- STYLE INLINE — Khusus view dashboard_member saja              -->
<!-- Common styles (premium-card, skeleton-box, btn-primary, dst.) -->
<!-- sudah di-load dari css/style.css                              -->
<!-- ============================================================ -->
<style>
    /* ────────────── QUICK ACTION HOVER ────────────── */
    .quick-action {
        transition: all 180ms var(--ease-smooth);
        text-decoration: none;
    }
    .quick-action:hover {
        transform: translateY(-2px);
    }

    /* ────────────── RECENT CARD (sama dengan dashboard_admin) ────────────── */
    .recent-card {
        background: var(--card-bg);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid var(--card-border);
        border-radius: 1rem;
        padding: 1.25rem;
        transition: box-shadow 280ms var(--ease-smooth);
    }
    .recent-card:hover {
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }

    /* ────────────── RECENT LIST ITEM HOVER ────────────── */
    #recent-surat-member a,
    #recent-logbook-member > div {
        transition: all 200ms ease;
    }
    #recent-surat-member a:hover {
        transform: translateX(2px);
    }

    /* ────────────── RESPONSIVE ────────────── */
    @media (max-width: 640px) {
        .premium-card {
            padding: 1rem;
        }
        .premium-card .text-3xl {
            font-size: 1.5rem;
        }
        .recent-card {
            padding: 1rem;
        }
    }
</style>
