<style>
    /* ────────────── HERO ────────────── */
    .dokumen-hero {
        background: linear-gradient(135deg, #0f2922 0%, #1a3c34 50%, #0f2922 100%);
        position: relative;
        overflow: hidden;
    }
    .dokumen-hero::before {
        content: '';
        position: absolute;
        top: -30%;
        right: -15%;
        width: 500px;
        height: 500px;
        background: radial-gradient(circle, rgba(251, 191, 36, 0.15), transparent 70%);
        border-radius: 50%;
        pointer-events: none;
    }
    .dokumen-hero::after {
        content: '';
        position: absolute;
        bottom: -30%;
        left: -15%;
        width: 400px;
        height: 400px;
        background: radial-gradient(circle, rgba(22, 163, 74, 0.2), transparent 70%);
        border-radius: 50%;
        pointer-events: none;
    }

    /* ────────────── CARD ────────────── */
    .dokumen-card {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        will-change: transform, box-shadow;
    }
    .dokumen-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
    }

    /* ────────────── RESPONSIVE ────────────── */
    @media (max-width: 640px) {
        .dokumen-hero h1 {
            font-size: 1.75rem !important;
        }
    }
</style>
