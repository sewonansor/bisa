<!-- views/dokumen.html -->
<!-- Fragment Halaman Dokumen Publik -->
<!-- Terbaru lengkap semua menu berfungsi tanpa error siap pakai SPA -->

<!-- HERO SECTION -->
<section class="pt-28 pb-12 bg-gradient-to-br from-green-900 to-green-800 text-white text-center">
    <div class="container mx-auto px-4">
        <h1 class="text-3xl sm:text-4xl font-bold font-amiri mb-4">Arsip Dokumen</h1>
        <p class="text-green-100 max-w-2xl mx-auto text-sm sm:text-base">
            Kumpulan dokumen resmi, AD/ART, SK Pengurus, dan laporan PAC GP Ansor Kapanewon Sewon.
        </p>
    </div>
</section>

<!-- DAFTAR DOKUMEN (GRID) dengan Skeleton -->
<section class="py-12 container mx-auto px-4">
    <div id="dokumen-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-6 max-w-5xl mx-auto">
        <!-- Skeleton Loading -->
        <div id="dokumen-skeleton" class="col-span-full grid grid-cols-1 sm:grid-cols-2 gap-6">
            <div class="dokumen-card skeleton"><div class="skeleton-box h-48 w-full"></div></div>
            <div class="dokumen-card skeleton"><div class="skeleton-box h-48 w-full"></div></div>
            <div class="dokumen-card skeleton"><div class="skeleton-box h-48 w-full"></div></div>
            <div class="dokumen-card skeleton"><div class="skeleton-box h-48 w-full"></div></div>
        </div>
        <!-- Konten Asli -->
        <div id="dokumen-content" class="col-span-full hidden grid grid-cols-1 sm:grid-cols-2 gap-6">
            <div class="col-span-full text-center py-12 text-[var(--text-muted)]">
                <i class="fas fa-spinner fa-spin text-3xl mb-3"></i>
                <p>Memuat data dokumen...</p>
            </div>
        </div>
    </div>
</section>

<!-- SCRIPT INLINE -->
<script>
    (async function() {
        const skeleton = document.getElementById('dokumen-skeleton');
        const content = document.getElementById('dokumen-content');
        
        // Tampilkan skeleton, sembunyikan konten
        skeleton.classList.remove('hidden');
        content.classList.add('hidden');

        try {
            // Ambil data arsip dari API
            const result = await apiCall('getArsip', 'POST', {});
            
            skeleton.classList.add('hidden');
            content.classList.remove('hidden');

            // Filter hanya dokumen yang relevan (kategori: dokumen, laporan, dll)
            // Bisa juga ditampilkan semua, tetapi kita filter untuk tampilan yang lebih bersih
            let docs = [];
            if (result.success && result.data.length > 0) {
                // Opsional: filter hanya kategori tertentu, atau tampilkan semua
                // Untuk halaman dokumen, kita tampilkan semua arsip
                docs = result.data;
            }

            if (docs.length > 0) {
                let html = '';
                docs.forEach((item, index) => {
                    // Tentukan ikon berdasarkan jenis file
                    let iconClass = 'fa-file';
                    let jenisLabel = 'File';
                    if (item.jenis === 'pdf') { iconClass = 'fa-file-pdf'; jenisLabel = 'PDF'; }
                    else if (item.jenis === 'docx') { iconClass = 'fa-file-word'; jenisLabel = 'DOCX'; }
                    else if (item.jenis === 'xlsx') { iconClass = 'fa-file-excel'; jenisLabel = 'XLSX'; }
                    else if (item.jenis === 'img') { iconClass = 'fa-image'; jenisLabel = 'Gambar'; }
                    else if (item.jenis === 'video') { iconClass = 'fa-video'; jenisLabel = 'Video'; }
                    else { iconClass = 'fa-file'; jenisLabel = 'File'; }

                    // Warna badge berdasarkan kategori
                    let badgeColor = 'bg-gray-100 text-gray-700 dark:bg-gray-700 dark:text-gray-300';
                    if (item.kategori === 'dokumen') badgeColor = 'bg-blue-100 text-blue-700 dark:bg-blue-900 dark:text-blue-300';
                    else if (item.kategori === 'laporan') badgeColor = 'bg-green-100 text-green-700 dark:bg-green-900 dark:text-green-300';
                    else if (item.kategori === 'foto') badgeColor = 'bg-purple-100 text-purple-700 dark:bg-purple-900 dark:text-purple-300';
                    else if (item.kategori === 'video') badgeColor = 'bg-red-100 text-red-700 dark:bg-red-900 dark:text-red-300';

                    html += `
                        <div class="dokumen-card bg-[var(--card-bg)] backdrop-blur-sm p-6 rounded-2xl shadow-lg border border-[var(--card-border)] transition hover:shadow-xl hover:translate-y-[-4px]">
                            <div class="flex items-start justify-between mb-3">
                                <div class="flex items-center space-x-3">
                                    <div class="text-3xl text-[var(--text-main)]">
                                        <i class="fas ${iconClass}"></i>
                                    </div>
                                    <div>
                                        <h3 class="text-lg font-bold text-[var(--text-main)]">${item.judul || 'Dokumen'}</h3>
                                        <p class="text-sm text-[var(--text-muted)]">${item.tahun || '-'} • ${jenisLabel}</p>
                                    </div>
                                </div>
                                <span class="px-2 py-1 rounded-full text-xs font-semibold ${badgeColor}">${item.kategori || 'Umum'}</span>
                            </div>
                            <p class="text-[var(--text-muted)] text-sm line-clamp-2 mb-3">${item.deskripsi || ''}</p>
                            <div class="flex justify-between items-center pt-3 border-t border-[var(--card-border)]">
                                <span class="text-xs text-[var(--text-muted)]"><i class="far fa-calendar mr-1"></i>${formatDate(item.created_at)}</span>
                                ${item.file_url ? `<a href="${item.file_url}" target="_blank" class="text-[var(--text-main)] hover:underline text-sm font-medium flex items-center gap-1"><i class="fas fa-download"></i> Download</a>` : '<span class="text-xs text-[var(--text-muted)]">Tidak ada file</span>'}
                            </div>
                        </div>
                    `;
                });
                content.innerHTML = html;
            } else {
                content.innerHTML = `
                    <div class="col-span-full text-center py-12 text-[var(--text-muted)]">
                        <i class="fas fa-folder-open text-4xl mb-3 text-gray-300"></i>
                        <p>Belum ada dokumen yang tersedia.</p>
                    </div>
                `;
            }
        } catch (error) {
            skeleton.classList.add('hidden');
            content.classList.remove('hidden');
            content.innerHTML = `
                <div class="col-span-full text-center py-12 text-red-500">
                    <i class="fas fa-exclamation-triangle text-3xl mb-2"></i>
                    <p>Error: ${error.message}</p>
                </div>
            `;
        }
    })();
</script>

<!-- STYLE INLINE (bisa digabung ke CSS global) -->
<style>
    .dokumen-card {
        transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
    }
    .dokumen-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 30px rgba(0,0,0,0.08);
    }
    .dokumen-card.skeleton .skeleton-box {
        height: 120px;
    }
</style>
