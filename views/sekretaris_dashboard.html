<!-- views/sekretaris_dashboard.html -->
<!-- Versi: 2.1.0 — Full Fix Layout & Sinkronisasi ID -->

<div id="main-content" class="sk-dash-wrap">

    <!-- ═══════════════════════════════════════════════════════ -->
    <!-- HEADER & ACTION                                        -->
    <!-- ═══════════════════════════════════════════════════════ -->
    <div class="sk-header">
        <div class="sk-header-left">
            <h1 class="sk-page-title">
                <i class="fas fa-chart-pie"></i> Dashboard Ranting
            </h1>
            <p class="sk-page-subtitle">
                Selamat datang di panel kendali <strong id="sk-ranting-name-header">-</strong>
            </p>
        </div>
        <div class="sk-header-actions">
            <button id="btn-refresh-dash" type="button" class="sk-btn sk-btn-secondary" title="Refresh Data">
                <i class="fas fa-sync-alt"></i>
                <span class="sk-btn-label">Refresh</span>
            </button>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════ -->
    <!-- STATS GRID (4 KARTU)                                   -->
    <!-- ═══════════════════════════════════════════════════════ -->
    <div class="sk-stats-grid">
        <!-- Surat -->
        <div class="sk-stat-card">
            <div class="sk-stat-flex">
                <div>
                    <p class="sk-stat-label">Total Surat</p>
                    <p class="sk-stat-value" id="stat-total-surat">0</p>
                </div>
                <div class="sk-stat-icon sk-stat-icon-blue"><i class="fas fa-file-alt"></i></div>
            </div>
        </div>
        <!-- Logbook -->
        <div class="sk-stat-card">
            <div class="sk-stat-flex">
                <div>
                    <p class="sk-stat-label">Total Logbook</p>
                    <p class="sk-stat-value sk-stat-value-green" id="stat-total-logbook">0</p>
                </div>
                <div class="sk-stat-icon sk-stat-icon-green"><i class="fas fa-book"></i></div>
            </div>
        </div>
        <!-- Anggota -->
        <div class="sk-stat-card">
            <div class="sk-stat-flex">
                <div>
                    <p class="sk-stat-label">Anggota Ranting</p>
                    <p class="sk-stat-value sk-stat-value-purple" id="stat-total-anggota">0</p>
                </div>
                <div class="sk-stat-icon sk-stat-icon-purple"><i class="fas fa-users"></i></div>
            </div>
        </div>
        <!-- Saldo -->
        <div class="sk-stat-card">
            <div class="sk-stat-flex">
                <div>
                    <p class="sk-stat-label">Saldo Ranting</p>
                    <p class="sk-stat-value sk-stat-value-amber" id="stat-total-saldo">Rp 0</p>
                </div>
                <div class="sk-stat-icon sk-stat-icon-amber"><i class="fas fa-coins"></i></div>
            </div>
        </div>
    </div>

    <!-- ═══════════════════════════════════════════════════════ -->
    <!-- BANNER KEGIATAN BULAN INI                              -->
    <!-- ═══════════════════════════════════════════════════════ -->
    <div class="sk-banner">
        <div class="sk-banner-icon"><i class="fas fa-calendar-check"></i></div>
        <div class="sk-banner-content">
            <p class="sk-banner-label">Kegiatan Bulan Ini</p>
            <p class="sk-banner-value"><span id="stat-kegiatan-bulan">0</span> kegiatan tercatat</p>
        </div>
        <a href="#/sekretaris_logbook" class="sk-banner-link">Kelola Logbook &rarr;</a>
    </div>

    <!-- ═══════════════════════════════════════════════════════ -->
    <!-- RECENT LISTS (SURAT & LOGBOOK)                         -->
    <!-- ═══════════════════════════════════════════════════════ -->
    <div class="sk-recent-grid">
        
        <!-- Recent Surat -->
        <div class="sk-card">
            <div class="sk-card-header">
                <h3 class="sk-card-title"><i class="fas fa-file-alt text-blue-500"></i> Surat Terbaru</h3>
                <a href="#/sekretaris_surat" class="sk-card-link">Lihat semua</a>
            </div>
            <div id="recent-surat-list" class="sk-card-body">
                <div class="sk-loading-center"><i class="fas fa-spinner fa-spin"></i></div>
            </div>
        </div>

        <!-- Recent Logbook -->
        <div class="sk-card">
            <div class="sk-card-header">
                <h3 class="sk-card-title"><i class="fas fa-book text-green-500"></i> Logbook Terbaru</h3>
                <a href="#/sekretaris_logbook" class="sk-card-link">Lihat semua</a>
            </div>
            <div id="recent-logbook-list" class="sk-card-body">
                <div class="sk-loading-center"><i class="fas fa-spinner fa-spin"></i></div>
            </div>
        </div>

    </div>

</div>
