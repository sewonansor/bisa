</section>

<!-- ============================================================ -->
<!-- KONTEN UTAMA                                                  -->

    <div class="max-w-5xl mx-auto">

                    <div>
                        <h4 class="font-semibold text-[var(--text-main)] text-lg mb-1">Alamat</h4>

                            Jl. Contoh No. 123, Kapanewon Sewon, Bantul, Yogyakarta
                        </p>
                    </div>
                </div>
            </div>

            <!-- Telepon -->
            <div class="glass-card p-6 rounded-2xl" data-aos="fade-left">
                <div class="flex items-center space-x-4">
                    <div class="kontak-icon">
                        <i class="fas fa-phone"></i>
                    </div>
                    <div>
                        <h4 class="font-semibold text-[var(--text-main)] text-lg mb-1">Telepon</h4>
                        <p class="text-sm text-[var(--text-muted)]">
                            +62 812 3456 7890
                        </p>
                    </div>
                </div>
            </div>

            <!-- Email -->
            <div class="glass-card p-6 rounded-2xl" data-aos="fade-right">
                <div class="flex items-center space-x-4">
                    <div class="kontak-icon">
                        <i class="fas fa-envelope"></i>
                    </div>
                    <div>
                        <h4 class="font-semibold text-[var(--text-main)] text-lg mb-1">Email</h4>
                        <p class="text-sm text-[var(--text-muted)]">
                            ansor.sewon@gmail.com
                        </p>
                    </div>
                </div>
            </div>

            <!-- Media Sosial -->
            <div class="glass-card p-6 rounded-2xl" data-aos="fade-left">
                <div class="flex items-center space-x-4">
                    <div class="kontak-icon">
                        <i class="fas fa-globe"></i>
                    </div>
                    <div>
                        <h4 class="font-semibold text-[var(--text-main)] text-lg mb-1">Media Sosial</h4>
                        <div class="flex space-x-4 text-2xl mt-1">
                            <a href="#" class="kontak-social kontak-social-fb" title="Facebook">
                                <i class="fab fa-facebook"></i>
                            </a>
                            <a href="#" class="kontak-social kontak-social-tw" title="Twitter">
                                <i class="fab fa-twitter"></i>
                            </a>
                            <a href="#" class="kontak-social kontak-social-ig" title="Instagram">
                                <i class="fab fa-instagram"></i>
                            </a>
                            <a href="#" class="kontak-social kontak-social-yt" title="YouTube">
                                <i class="fab fa-youtube"></i>
                            </a>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</section>

<!-- ============================================================ -->
<!-- STYLE INLINE — Khusus view kontak saja                        -->
<!-- Common styles (glass-card) sudah di css/style.css             -->
<!-- ============================================================ -->
<style>
    /* ────────────── HERO ────────────── */
    .kontak-hero {
        background: linear-gradient(135deg, #0f2922 0%, #1a3c34 100%);
    }

    /* ────────────── ICON CIRCLE ────────────── */
    .kontak-icon {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: var(--bg-stats);
        border: 1px solid var(--card-border);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--text-main);
        font-size: 1.25rem;
        flex-shrink: 0;
        transition: all 220ms var(--ease-spring);
    }
    .glass-card:hover .kontak-icon {
        transform: rotate(-8deg) scale(1.08);
        background: linear-gradient(135deg, var(--accent-400), var(--accent-500));
        color: var(--brand-900);
        border-color: transparent;
    }

    /* ────────────── SOCIAL ICONS ────────────── */
    .kontak-social {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: transform 220ms var(--ease-spring),
                    color 220ms ease;
        text-decoration: none;
    }
    .kontak-social:hover {
        transform: translateY(-3px) scale(1.12);
    }
    .kontak-social-fb { color: #1877F2; }
    .kontak-social-fb:hover { color: #0d5bbd; }
    .kontak-social-tw { color: #1DA1F2; }
    .kontak-social-tw:hover { color: #0c85d0; }
    .kontak-social-ig { color: #E4405F; }
    .kontak-social-ig:hover { color: #c02646; }
    .kontak-social-yt { color: #FF0000; }
    .kontak-social-yt:hover { color: #cc0000; }
</style>
