<!-- views/proker_admin.html -->
<!-- Halaman Admin: Manajemen Program Kerja -->
<!-- Logic: js/proker_admin.js | Route: /proker_admin -->
<!-- Versi: 2.0.0 — CSS common sudah di css/style.css -->

<div id="main-content">
    <!-- ============================================================ -->
    <!-- HEADER                                                        -->
    <!-- ============================================================ -->
    <div class="flex flex-wrap justify-between items-center mb-6 gap-4">
        <h1 class="text-3xl font-bold text-[var(--text-main)] font-amiri">
            <i class="fas fa-tasks mr-2"></i>
            Manajemen Program Kerja
        </h1>
        <div class="flex flex-wrap gap-2">
            <button id="refresh-proker-btn"
                    class="btn-secondary px-4 py-2 rounded-lg flex items-center gap-2">
                <i class="fas fa-sync-alt"></i>
                <span class="hidden sm:inline">Refresh</span>
            </button>
            <button id="add-btn"
                    class="btn-primary px-4 py-2 rounded-lg flex items-center gap-2">
                <i class="fas fa-plus"></i>
                <span>Tambah Program</span>
            </button>
            <button id="mobile-menu-btn"
                    class="md:hidden text-2xl text-[var(--text-muted)]"
                    aria-label="Buka Menu">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- RINGKASAN STATISTIK                                           -->
    <!-- ============================================================ -->
    <div class="grid grid-cols-1 sm:grid-cols-4 gap-4 mb-6">
        <div class="stat-card p-4 rounded-xl bg-[var(--card-bg)] backdrop-blur-sm border border-[var(--card-border)]">
            <p class="text-xs sm:text-sm text-[var(--text-muted)] font-medium uppercase tracking-wider">
                Total Program
            </p>
            <p class="text-2xl font-bold text-[var(--text-main)] mt-1" id="total-program">0</p>
        </div>
        <div class="stat-card p-4 rounded-xl bg-[var(--card-bg)] backdrop-blur-sm border border-[var(--card-border)]">
            <p class="text-xs sm:text-sm text-[var(--text-muted)] font-medium uppercase tracking-wider">
                Planning
            </p>
            <p class="text-2xl font-bold text-yellow-600 mt-1" id="total-planning">0</p>
        </div>
        <div class="stat-card p-4 rounded-xl bg-[var(--card-bg)] backdrop-blur-sm border border-[var(--card-border)]">
            <p class="text-xs sm:text-sm text-[var(--text-muted)] font-medium uppercase tracking-wider">
                Ongoing
            </p>
            <p class="text-2xl font-bold text-blue-600 mt-1" id="total-ongoing">0</p>
        </div>
        <div class="stat-card p-4 rounded-xl bg-[var(--card-bg)] backdrop-blur-sm border border-[var(--card-border)]">
            <p class="text-xs sm:text-sm text-[var(--text-muted)] font-medium uppercase tracking-wider">
                Selesai
            </p>
            <p class="text-2xl font-bold text-green-600 mt-1" id="total-selesai">0</p>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- TABEL PROGRAM KERJA                                           -->
    <!-- ============================================================ -->
    <div class="table-wrapper">
        <div class="overflow-x-auto">
            <table class="w-full">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama Program</th>
                        <th>Deskripsi</th>
                        <th>Target</th>
                        <th>Progress</th>
                        <th>Status</th>
                        <th>PIC</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="table-body" class="divide-y divide-[var(--card-border)]">
                    <!-- SKELETON LOADING -->
                    <tr id="proker-skeleton">
                        <td colspan="8" class="text-center py-8">
                            <i class="fas fa-spinner fa-spin text-2xl text-[var(--text-muted)]"></i>
                            <p class="text-[var(--text-muted)] text-sm mt-2">Memuat data program kerja...</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- ============================================================ -->
<!-- MODAL: TAMBAH / EDIT PROGRAM KERJA                            -->
<!-- ============================================================ -->
<div id="proker-modal"
     class="fixed inset-0 bg-black/50 hidden items-center justify-center z-[9999] backdrop-blur-sm p-4">
    <div id="modal-content"
         class="bg-[var(--card-bg)] rounded-2xl shadow-2xl max-w-md w-full p-6 transform scale-95 opacity-0 transition-all duration-300 max-h-[90vh] overflow-y-auto">

        <h2 id="modal-title"
            class="text-2xl font-bold mb-4 text-[var(--text-main)] font-amiri">
            Tambah Program Kerja
        </h2>

        <form id="form" class="space-y-4">
            <input type="hidden" id="edit-id">

            <div>
                <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                    Nama Program <span class="text-red-500">*</span>
                </label>
                <input type="text" id="proker_nama"
                       class="form-input"
                       placeholder="Contoh: Pengajian Rutin"
                       required>
            </div>

            <div>
                <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                    Deskripsi
                </label>
                <textarea id="proker_deskripsi" rows="2"
                          class="form-input"
                          placeholder="Deskripsi singkat program"></textarea>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                        Target Selesai
                    </label>
                    <input type="date" id="proker_target"
                           class="form-input">
                </div>
                <div>
                    <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                        Progress (%) <span class="text-red-500">*</span>
                    </label>
                    <input type="number" id="proker_progress"
                           class="form-input"
                           min="0" max="100"
                           value="0"
                           required>
                </div>
                <div>
                    <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                        Status
                    </label>
                    <select id="proker_status" class="form-input">
                        <option value="planning">Planning</option>
                        <option value="ongoing">Ongoing</option>
                        <option value="selesai">Selesai</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                        PIC (Penanggung Jawab)
                    </label>
                    <input type="text" id="proker_pic"
                           class="form-input"
                           placeholder="Nama PIC">
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-2">
                <button type="button" id="modal-close"
                        class="btn-secondary px-4 py-2 rounded-lg">
                    Batal
                </button>
                <button type="submit"
                        class="btn-primary px-4 py-2 rounded-lg">
                    <i class="fas fa-save mr-2"></i>
                    <span>Simpan</span>
                </button>
            </div>
        </form>
    </div>
</div>

<!-- ============================================================ -->
<!-- SCRIPT INLINE — Konfirmasi saja (no emoji)                    -->

<script>
    (function() {
        console.log('[View] proker_admin.html loaded — logic handled by js/proker_admin.js');
    })();
</script>

<!-- ============================================================ -->
<!-- STYLE INLINE — Khusus view proker_admin saja                  -->
<!-- Common styles (stat-card, btn-*, form-input, table-wrapper,   -->
<!-- skeleton-box) sudah di css/style.css                          -->
<!-- ============================================================ -->
<style>
    /* ────────────── PROGRESS BAR (dipakai di tabel) ────────────── */
    .progress-bar {
        height: 8px;
        border-radius: 9999px;
        background: #e5e7eb;
        overflow: hidden;
    }
    .dark .progress-bar {
        background: #334155;
    }
    .progress-bar .progress-fill {
        height: 100%;
        border-radius: 9999px;
        transition: width 0.5s var(--ease-smooth);
    }

    /* ────────────── RESPONSIVE ────────────── */
    @media (max-width: 640px) {
        #modal-content {
            padding: 1rem;
        }
    }
</style>
