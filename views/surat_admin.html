<!-- views/surat_admin.html -->
<!-- Halaman Admin: Manajemen Surat -->
<!-- Logic: js/surat_admin.js | Route: /surat_admin -->
<!-- Versi: 2.0.0 — CSS common sudah di css/style.css -->

<div id="main-content">
    <!-- ============================================================ -->
    <!-- HEADER                                                        -->
    <!-- ============================================================ -->
    <div class="flex flex-wrap justify-between items-center mb-6 gap-4">
        <h1 class="text-3xl font-bold text-[var(--text-main)] font-amiri">
            <i class="fas fa-file-alt mr-2"></i>
            Manajemen Surat
        </h1>
        <div class="flex flex-wrap gap-2">
            <button id="refresh-surat-btn"
                    class="btn-secondary px-4 py-2 rounded-lg flex items-center gap-2">
                <i class="fas fa-sync-alt"></i>
                <span class="hidden sm:inline">Refresh</span>
            </button>
            <button id="add-surat-btn"
                    class="btn-primary px-4 py-2 rounded-lg flex items-center gap-2">
                <i class="fas fa-plus"></i>
                <span>Tambah Surat</span>
            </button>
            <button id="mobile-menu-btn"
                    class="md:hidden text-2xl text-[var(--text-muted)]"
                    aria-label="Buka Menu">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- TABEL SURAT                                                   -->
    <!-- ============================================================ -->
    <div class="table-wrapper">
        <div class="overflow-x-auto">
            <table class="w-full">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nomor Surat</th>
                        <th>Perihal</th>
                        <th>Tanggal</th>
                        <th>Pengirim</th>
                        <th>Penerima</th>
                        <th>Pembuat</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="surat-table-body" class="divide-y divide-[var(--card-border)]">
                    <!-- SKELETON LOADING -->
                    <tr id="surat-skeleton">
                        <td colspan="8" class="text-center py-8">
                            <i class="fas fa-spinner fa-spin text-2xl text-[var(--text-muted)]"></i>
                            <p class="text-[var(--text-muted)] text-sm mt-2">Memuat data surat...</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- ============================================================ -->
<!-- MODAL: TAMBAH / EDIT SURAT                                    -->
<!-- ============================================================ -->
<div id="surat-modal"
     class="fixed inset-0 bg-black/50 hidden items-center justify-center z-[9999] backdrop-blur-sm p-4">
    <div id="modal-content"
         class="bg-[var(--card-bg)] rounded-2xl shadow-2xl max-w-2xl w-full p-6 transform scale-95 opacity-0 transition-all duration-300 max-h-[90vh] overflow-y-auto">

        <h2 id="modal-title"
            class="text-2xl font-bold mb-4 text-[var(--text-main)] font-amiri">
            Tambah Surat
        </h2>

        <form id="surat-form" class="space-y-4">
            <input type="hidden" id="surat-id">

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                        Nomor Surat (Otomatis)
                    </label>
                    <input type="text" id="nomor_surat"
                           class="form-input"
                           placeholder="Otomatis dibuat sistem"
                           disabled>
                </div>

                <div>
                    <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                        Jenis Surat
                    </label>
                    <select id="jenis_surat" class="form-input">
                        <option value="internal">Internal (SR-01)</option>
                        <option value="eksternal">Eksternal (SR-02)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                        Perihal <span class="text-red-500">*</span>
                    </label>
                    <input type="text" id="perihal"
                           class="form-input"
                           placeholder="Contoh: Undangan Rapat"
                           required>
                </div>

                <div>
                    <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                        Tanggal <span class="text-red-500">*</span>
                    </label>
                    <input type="date" id="tanggal"
                           class="form-input"
                           required>
                </div>

                <div>
                    <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                        Pengirim <span class="text-red-500">*</span>
                    </label>
                    <input type="text" id="pengirim"
                           class="form-input"
                           placeholder="Contoh: PAC GP Ansor Sewon"
                           required>
                </div>

                <div>
                    <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                        Penerima <span class="text-red-500">*</span>
                    </label>
                    <input type="text" id="penerima"
                           class="form-input"
                           placeholder="Contoh: PC GP Ansor Bantul"
                           required>
                </div>
            </div>

            <div>
                <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                    Lampiran (URL)
                </label>
                <input type="text" id="lampiran"
                       class="form-input"
                       placeholder="URL dokumen (opsional)">
            </div>

            <div>
                <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                    Upload File Lampiran
                </label>
                <input type="file" id="surat_file"
                       class="form-input"
                       accept="image/*,.pdf,.doc,.docx">
                <p class="text-xs text-[var(--text-muted)] mt-1">
                    <i class="fas fa-info-circle mr-1"></i>
                    File akan diunggah ke Google Drive dan URL otomatis terisi ke lampiran.
                </p>
            </div>

            <div>
                <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                    Isi Surat <span class="text-red-500">*</span>
                </label>
                <textarea id="isi" rows="4"
                          class="form-input"
                          placeholder="Tulis isi surat secara lengkap..."
                          required></textarea>
            </div>

            <div class="flex justify-end gap-2 pt-2">
                <button type="button" id="modal-close"
                        class="btn-secondary px-4 py-2 rounded-lg">
                    Batal
                </button>
                <button type="submit"
                        class="btn-primary px-4 py-2 rounded-lg">
                    <i class="fas fa-save mr-2"></i>
                    <span>Simpan</span>
                </button>
            </div>
        </form>
    </div>
</div>
