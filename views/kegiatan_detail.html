<!-- views/kegiatan_detail.html -->
<!-- Halaman Publik: Detail Kegiatan -->
<!-- Logic: js/kegiatan_detail.js | Route: /kegiatan_detail?id=xxx -->
<!-- Versi: 2.0.0 — CSS common sudah di css/style.css -->

<div class="container mx-auto px-4 pt-28 pb-12">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 max-w-7xl mx-auto">

        <!-- ==================================================== -->
        <!-- KOLOM KONTEN UTAMA (Kiri)                             -->
        <!-- ==================================================== -->
        <div class="lg:col-span-2 space-y-4">

            <!-- Breadcrumb -->
            <nav class="text-sm text-[var(--text-muted)]" aria-label="Breadcrumb">
                <i class="fas fa-home mr-1 text-[var(--text-main)]"></i>
                <a href="/" class="breadcrumb-link">Beranda</a>
                <span class="mx-1 text-[var(--card-border)]">/</span>
                <a href="/kegiatan" class="breadcrumb-link">Kegiatan</a>
                <span class="mx-1 text-[var(--card-border)]">/</span>
                <span id="breadcrumb-title" class="text-[var(--text-main)] font-medium">
                    Memuat...
                </span>
            </nav>

            <!-- Konten Utama -->
            <div class="bg-[var(--card-bg)] rounded-2xl shadow-sm border border-[var(--card-border)] p-6 md:p-8">

                <!-- Loading State (di-replace oleh JS) -->
                <div id="detail-main">
                    <div class="text-center py-12">
                        <i class="fas fa-spinner fa-spin text-4xl text-[var(--text-main)] mb-4"></i>
                        <p class="text-[var(--text-muted)] text-sm">
                            Sedang memuat detail kegiatan...
                        </p>
                    </div>
                </div>
            </div>

            <!-- Navigasi Kembali -->
            <div class="flex justify-start">
                <a href="/kegiatan" class="kegiatan-back-link">
                    <i class="fas fa-arrow-left"></i>
                    <span>Kembali ke Daftar Kegiatan</span>
                </a>
            </div>
        </div>

        <!-- ==================================================== -->
        <!-- KOLOM SIDEBAR (Kanan)                                 -->
        <!-- ==================================================== -->
        <aside class="lg:col-span-1 space-y-6">

            <!-- Kegiatan Terbaru -->
            <div class="sidebar-card lg:sticky lg:top-24">
                <div class="sidebar-card-header">
                    <div class="sidebar-card-icon sidebar-card-icon-blue">
                        <i class="fas fa-clock"></i>
                    </div>
                    <h3 class="sidebar-card-title">Kegiatan Terbaru</h3>
                </div>
                <div id="recent-list" class="space-y-3">
                    <p class="text-sm text-[var(--text-muted)] text-center py-4">
                        <i class="fas fa-spinner fa-spin mr-1"></i>Memuat data...
                    </p>
                </div>
            </div>

            <!-- Arsip per Bulan -->
            <div class="sidebar-card">
                <div class="sidebar-card-header">
                    <div class="sidebar-card-icon sidebar-card-icon-purple">
                        <i class="fas fa-archive"></i>
                    </div>
                    <h3 class="sidebar-card-title">Arsip Kegiatan</h3>
                </div>
                <div id="archive-list" class="space-y-1 text-sm">
                    <p class="text-sm text-[var(--text-muted)] text-center py-2">
                        <i class="fas fa-spinner fa-spin mr-1"></i>Memuat data...
                    </p>
                </div>
            </div>

        </aside>
    </div>
</div>

<!-- STYLE INLINE — Khusus view kegiatan_detail saja               -->
<!-- Common styles sudah di css/style.css                          -->
<!-- ============================================================ -->
<style>
    /* ────────────── BREADCRUMB ────────────── */
    .breadcrumb-link {
        transition: color 180ms ease;
        color: inherit;
        text-decoration: none;
    }
    .breadcrumb-link:hover {
        color: var(--text-main);
        text-decoration: underline;
    }

    /* ────────────── BACK LINK ────────────── */
    .kegiatan-back-link {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.875rem;
        color: var(--text-muted);
        text-decoration: none;
        transition: color 180ms ease;
        font-weight: 500;
    }
    .kegiatan-back-link:hover {
        color: var(--text-main);
    }
    .kegiatan-back-link i {
        transition: transform 180ms ease;
    }
    .kegiatan-back-link:hover i {
        transform: translateX(-4px);
    }

    /* ────────────── DETAIL IMAGE WRAPPER ────────────── */
    .detail-image-wrapper {
        max-height: 450px;
        overflow: hidden;
        border-radius: 1rem;
        background: var(--bg-stats);
        position: relative;
    }
    .detail-image-wrapper img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.5s ease;
    }
    .detail-image-wrapper:hover img {
        transform: scale(1.02);
    }

    /* ────────────── SIDEBAR CARD ────────────── */
    .sidebar-card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 1rem;
        padding: 1.25rem;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.03);
    }
    .sidebar-card-header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 1rem;
        padding-bottom: 0.75rem;
        border-bottom: 1px solid var(--card-border);
    }
    .sidebar-card-icon {
        width: 40px;
        height: 40px;
        border-radius: 0.5rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        font-size: 0.9rem;
        flex-shrink: 0;
    }
    .sidebar-card-icon-blue {
        background: linear-gradient(135deg, #60a5fa, #4f46e5);
    }
    .sidebar-card-icon-purple {
        background: linear-gradient(135deg, #c084fc, #c026d3);
    }
    .sidebar-card-title {
        font-size: 1.05rem;
        font-weight: 700;
        font-family: 'Amiri', serif;
        color: var(--text-main);
        margin: 0;
        line-height: 1.3;
    }

    /* ────────────── SIDEBAR ITEM (hover) ────────────── */
    .sidebar-item {
        display: block;
        border-radius: 0.5rem;
        padding: 0.5rem;
        transition: all 180ms ease;
        text-decoration: none;
    }
    .sidebar-item:hover {
        background: var(--bg-stats);
        transform: translateX(2px);
    }

    /* ────────────── PROSE (konten dari JS) ────────────── */
    #detail-main .prose {
        line-height: 1.75;
        color: var(--text-muted);
    }
    #detail-main .prose p {
        margin-bottom: 1rem;
    }
    #detail-main .prose h2,
    #detail-main .prose h3,
    #detail-main .prose h4 {
        font-family: 'Amiri', serif;
        font-weight: 700;
        color: var(--text-main);
        margin-top: 1.5rem;
        margin-bottom: 0.75rem;
        line-height: 1.3;
    }
    #detail-main .prose ul,
    #detail-main .prose ol {
        margin: 0.75rem 0 1rem 1.5rem;
        padding: 0;
    }
    #detail-main .prose li {
        margin-bottom: 0.35rem;
    }
    #detail-main .prose strong {
        color: var(--text-main);
        font-weight: 600;
    }
    #detail-main .prose img {
        max-width: 100%;
        height: auto;
        border-radius: 0.75rem;
        margin: 1rem 0;
    }
    #detail-main .prose a {
        color: var(--brand-700);
        text-decoration: underline;
        text-decoration-thickness: 1.5px;
        text-underline-offset: 3px;
    }
    #detail-main .prose a:hover {
        color: var(--accent-500);
    }
    .dark #detail-main .prose a {
        color: var(--accent-400);
    }

    /* ────────────── RESPONSIVE ────────────── */
    @media (max-width: 1023px) {
        aside .lg\:sticky {
            position: relative !important;
            top: auto !important;
        }
    }
    @media (max-width: 640px) {
        .detail-image-wrapper {
            max-height: 280px;
        }
        .sidebar-card {
            padding: 1rem;
        }
    }
</style>
