<!-- views/kegiatan_detail.html -->
<!-- Fragment Halaman Detail Kegiatan Publik - Menggunakan Logbook -->
<!-- Versi: 4.1.0 - Final Fix (Stable, No Loop, Sinkron dengan Backend) -->

<!-- CONTENT WRAPPER -->
<div class="container mx-auto px-4 pt-28 pb-12">
    <div id="detail-content" class="grid grid-cols-1 lg:grid-cols-3 gap-8 max-w-7xl mx-auto">
        
        <!-- Kolom Konten Utama (Kiri) -->
        <div class="lg:col-span-2 space-y-4">
            <!-- Breadcrumb -->
            <p class="text-sm text-[var(--text-muted)]">
                <i class="fas fa-home mr-1 text-[var(--text-main)]"></i> 
                <a href="/" class="hover:underline">Beranda</a> / 
                <a href="/kegiatan" class="hover:underline">Kegiatan</a> / 
                <span id="breadcrumb-title" class="text-[var(--text-main)] font-medium">Memuat...</span>
            </p>
            
            <!-- Konten Utama -->
            <div class="bg-[var(--card-bg)] rounded-2xl shadow-sm border border-[var(--card-border)] p-6 md:p-8">
                <div id="detail-main">
                    <div class="text-center py-12">
                        <i class="fas fa-spinner fa-spin text-4xl text-[var(--text-main)] mb-4"></i>
                        <p class="text-[var(--text-muted)]">Sedang memuat detail kegiatan...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Kolom Sidebar (Kanan) -->
        <div class="lg:col-span-1 space-y-6">
            
            <!-- Berita Terbaru -->
            <div class="bg-[var(--card-bg)] rounded-2xl shadow-sm border border-[var(--card-border)] p-5 sticky top-24">
                <h3 class="text-lg font-bold font-amiri text-[var(--text-main)] mb-4 border-b border-[var(--card-border)] pb-3">Kegiatan Terbaru</h3>
                <div id="recent-list" class="space-y-3">
                    <p class="text-sm text-[var(--text-muted)] text-center py-4">Memuat data...</p>
                </div>
            </div>

            <!-- Arsip -->
            <div class="bg-[var(--card-bg)] rounded-2xl shadow-sm border border-[var(--card-border)] p-5 sticky top-24">
                <h3 class="text-lg font-bold font-amiri text-[var(--text-main)] mb-4 border-b border-[var(--card-border)] pb-3">Arsip</h3>
                <div id="archive-list" class="space-y-1 text-sm text-[var(--text-muted)]">
                    <p class="text-sm text-[var(--text-muted)] text-center py-2">Memuat data...</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- SCRIPT INLINE -->
<script>
    // Daftarkan modul kegiatan_detail ke App registry
    App.register('kegiatan_detail', function() {
        // === Logika detail kegiatan ===
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');

        if (!id) {
            document.getElementById('detail-main').innerHTML = `<p class="text-red-500 text-center py-8">ID Kegiatan tidak ditemukan di URL.</p>`;
            return;
        }

        document.getElementById('breadcrumb-title').textContent = 'Memuat Detail...';

        async function loadDetail() {
            try {
                // Menggunakan getLogbook, bukan getLpj
                const result = await apiCall('getLogbook', 'POST', {});
                if (result.success && result.data.length > 0) {
                    const item = result.data.find(l => l.id === id);
                    if (item) {
                        renderDetail(item);
                        renderSidebar(result.data);
                    } else {
                        document.getElementById('detail-main').innerHTML = `<p class="text-red-500 text-center py-8">Kegiatan dengan ID ${id} tidak ditemukan.</p>`;
                    }
                } else {
                    document.getElementById('detail-main').innerHTML = `<p class="text-[var(--text-muted)] text-center py-8">Gagal memuat data kegiatan.</p>`;
                }
            } catch (error) {
                document.getElementById('detail-main').innerHTML = `<p class="text-red-500 text-center py-8">Error: ${error.message}</p>`;
            }
        }

        function renderDetail(item) {
            const imgUrl = item.file_url || 'https://placehold.co/1200x600/e2e8f0/475569?text=Kegiatan+Ansor';
            document.getElementById('breadcrumb-title').textContent = item.kegiatan || 'Kegiatan';
            
            document.getElementById('detail-main').innerHTML = `
                <h1 class="text-2xl md:text-3xl font-bold text-[var(--text-main)] font-amiri mb-4">${item.kegiatan || 'Kegiatan'}</h1>
                
                <!-- Meta Info -->
                <div class="flex flex-wrap items-center gap-4 text-xs text-[var(--text-muted)] mb-6 border-b border-[var(--card-border)] pb-4">
                    <span><i class="far fa-calendar-alt mr-1 text-[var(--text-main)]"></i> ${formatDate(item.tanggal_mulai)} - ${formatDate(item.tanggal_selesai)}</span>
                    <span class="hidden sm:inline text-[var(--card-border)]">|</span>
                    <span><i class="fas fa-map-marker-alt mr-1 text-[var(--text-main)]"></i> ${item.tempat || '-'}</span>
                    <span class="hidden sm:inline text-[var(--card-border)]">|</span>
                    <span><i class="fas fa-users mr-1 text-[var(--text-main)]"></i> ${item.peserta || 0} Peserta</span>
                </div>

                <!-- Gambar Utama -->
                <div class="detail-image-wrapper mb-6">
                    <img src="${imgUrl}" alt="${item.kegiatan}" loading="lazy" />
                </div>
                
                <!-- Deskripsi -->
                <div class="prose max-w-none text-[var(--text-muted)] leading-relaxed">
                    ${item.deskripsi || '<p class="text-[var(--text-muted)] italic">Belum ada deskripsi untuk kegiatan ini.</p>'}
                </div>

                <!-- Box Anggaran -->
                ${item.anggaran && Number(item.anggaran) > 0 ? `
                    <div class="mt-6 p-4 bg-green-50 border border-green-200 rounded-xl text-green-800 flex items-center gap-3">
                        <i class="fas fa-coins text-xl"></i>
                        <div>
                            <span class="block text-sm font-medium">Anggaran Kegiatan</span>
                            <span class="font-bold text-lg">${formatRupiah(item.anggaran)}</span>
                        </div>
                    </div>
                ` : ''}
            `;
        }

        function renderSidebar(allData) {
            // 5a. Kegiatan Terbaru (3 item teratas)
            const sorted = [...allData].sort((a, b) => new Date(b.tanggal_mulai) - new Date(a.tanggal_mulai));
            const recent = sorted.slice(0, 3);
            
            const recentContainer = document.getElementById('recent-list');
            if (recent.length > 0) {
                recentContainer.innerHTML = recent.map(r => `
                    <a href="/kegiatan_detail?id=${r.id}" class="block sidebar-item rounded-lg p-2 transition hover:bg-[var(--bg-stats)]">
                        <div class="flex items-start gap-3">
                            <div class="w-16 h-12 rounded-lg bg-[var(--bg-stats)] overflow-hidden flex-shrink-0 border border-[var(--card-border)]">
                                <img src="${r.file_url || 'https://placehold.co/100x80/e2e8f0/475569?text=Img'}" class="w-full h-full object-cover">
                            </div>
                            <div>
                                <h4 class="text-sm font-medium text-[var(--text-main)] line-clamp-1">${r.kegiatan || 'Kegiatan'}</h4>
                                <p class="text-xs text-[var(--text-muted)] mt-1"><i class="far fa-calendar-alt mr-1"></i> ${formatDate(r.tanggal_mulai)}</p>
                            </div>
                        </div>
                    </a>
                `).join('');
            } else {
                recentContainer.innerHTML = '<p class="text-sm text-[var(--text-muted)] text-center py-4">Belum ada data terbaru.</p>';
            }

            // 5b. Arsip (Pengelompokan berdasarkan Bulan-Tahun)
            const archiveContainer = document.getElementById('archive-list');
            const monthMap = {};

            allData.forEach(item => {
                if (item.tanggal_mulai) {
                    const date = new Date(item.tanggal_mulai);
                    if (!isNaN(date.getTime())) {
                        const key = date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0');
                        if (!monthMap[key]) {
                            monthMap[key] = {
                                label: date.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' }),
                                count: 0
                            };
                        }
                        monthMap[key].count++;
                    }
                }
            });

            const sortedKeys = Object.keys(monthMap).sort((a, b) => b.localeCompare(a));

            if (sortedKeys.length > 0) {
                archiveContainer.innerHTML = sortedKeys.map(key => {
                    const data = monthMap[key];
                    return `
                        <div class="flex justify-between items-center py-2 border-b border-[var(--card-border)] last:border-0 hover:bg-[var(--bg-stats)] px-2 rounded transition cursor-pointer">
                            <span class="text-[var(--text-main)] font-medium">${data.label}</span>
                            <span class="text-[var(--text-muted)] text-xs bg-[var(--bg-stats)] px-2 py-0.5 rounded-full">${data.count}</span>
                        </div>
                    `;
                }).join('');
            } else {
                archiveContainer.innerHTML = '<p class="text-sm text-[var(--text-muted)] text-center py-2">Belum ada arsip.</p>';
            }
        }

        // Jalankan
        loadDetail();
    });

    // Karena router akan memanggil App.run('kegiatan_detail'), modul akan dieksekusi.
    // Namun, untuk memastikan modul terdaftar sebelum di-run, kita sudah mendaftarkannya di atas.
    // Jika kita ingin eksekusi langsung tanpa menunggu router, kita bisa panggil App.run('kegiatan_detail') di sini,
    // tapi router sudah melakukannya. Jadi kita biarkan saja.
</script>

<!-- STYLE INLINE (bisa digabung ke CSS global) -->
<style>
    .detail-image-wrapper {
        max-height: 400px;
        overflow: hidden;
        border-radius: 1rem;
    }
    .detail-image-wrapper img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    .sidebar-item {
        transition: all 0.2s;
    }
    .sidebar-item:hover {
        background: var(--bg-stats);
    }
</style>
