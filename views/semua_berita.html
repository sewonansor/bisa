                    <div class="p-6 space-y-3">
                        <div class="skeleton-box h-3 w-1/4"></div>
                        <div class="skeleton-box h-6 w-3/4"></div>
                        <div class="skeleton-box h-6 w-2/3"></div>
                        <div class="skeleton-box h-4 w-full"></div>
                        <div class="skeleton-box h-4 w-5/6"></div>
                    </div>
                </div>
            </div>

            <!-- Normal Skeleton -->
            <div class="bg-[var(--card-bg)] rounded-2xl overflow-hidden shadow-md border border-[var(--card-border)]">
                <div class="skeleton-box h-48 w-full"></div>
                <div class="p-5 space-y-3">
                    <div class="skeleton-box h-3 w-1/4"></div>
                    <div class="skeleton-box h-5 w-3/4"></div>
                    <div class="skeleton-box h-5 w-2/3"></div>
                    <div class="skeleton-box h-4 w-full"></div>
                    <div class="skeleton-box h-4 w-5/6"></div>
                </div>
            </div>
        </div>

        <!-- KONTEN ASLI (diisi oleh js/semua_berita.js) -->

             class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">

        </div>
    </div>
</section>

<!-- STYLE INLINE — Khusus view semua_berita saja                  -->
<!-- Common styles (skeleton-box, dst.) sudah di css/style.css     -->
<!-- ============================================================ -->
<style>
    /* ────────────── HERO ────────────── */
    .semua-berita-hero {
        padding: 112px 0 48px;
        background: linear-gradient(135deg, #0f2922 0%, #1a3c34 100%);
        color: #ffffff;
        text-align: center;
    }

    /* ────────────── BERITA CARD ────────────── */
    .berita-card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 1rem;
        overflow: hidden;
        transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        display: block;
        text-decoration: none;
        will-change: transform, box-shadow;
    }
    .berita-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
        border-color: var(--text-main);
    }
    .berita-card .img-wrapper {
        height: 200px;
        overflow: hidden;
        background: var(--bg-stats);
    }
    .berita-card .img-wrapper img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.5s ease;
    }
    .berita-card:hover .img-wrapper img {
        transform: scale(1.05);
    }
    .berita-card .p-5 { padding: 1.25rem; }

    /* ────────────── FEATURED CARD ────────────── */
    .featured-card {
        grid-column: span 2;
        position: relative;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 1rem;
        overflow: hidden;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        display: block;
        text-decoration: none;
        min-height: 400px;
    }
    .featured-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
    }
    .featured-card .img-wrapper {
        height: 100%;
        min-height: 400px;
        overflow: hidden;
    }
    .featured-card .img-wrapper img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.5s ease;
    }
    .featured-card:hover .img-wrapper img {
        transform: scale(1.05);
    }
    .featured-card .overlay {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.85), transparent);
        color: white;
        padding: 1.5rem;
        z-index: 2;
    }
    .featured-card .overlay .tag {
        background: #0f2922;
        color: white;
        padding: 0.2rem 0.6rem;
        border-radius: 9999px;
        font-size: 0.7rem;
        font-weight: 600;
        text-transform: uppercase;
        display: inline-block;
    }
    .featured-card .overlay h3 {
        font-size: 1.5rem;
        line-height: 1.3;
        margin: 0.5rem 0;
        font-family: 'Amiri', serif;
    }

    /* ────────────── RESPONSIVE ────────────── */
    @media (max-width: 767px) {
        .featured-card {
            grid-column: span 1;
            min-height: 320px;
        }
        .featured-card .img-wrapper {
            min-height: 320px;
        }
    }

    @media (max-width: 640px) {
        .semua-berita-hero h1 {
            font-size: 1.75rem !important;
        }
    }
</style>
