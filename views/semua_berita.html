<!-- views/semua_berita.html -->
<!-- Halaman Publik: Semua Berita (Desain Profesional) -->
<!-- Versi: 1.1.0 - Final (Responsif, Skeleton, Featured, Grid) -->

<!-- HERO SECTION -->
<section class="pt-28 pb-12 bg-gradient-to-br from-green-900 to-green-800 text-white text-center">
    <div class="container mx-auto px-4">
        <h1 class="text-3xl sm:text-4xl font-bold font-amiri mb-4">Semua Berita</h1>
        <p class="text-green-100 max-w-2xl mx-auto text-sm sm:text-base">
            Kumpulan berita dan informasi terbaru dari PAC GP Ansor Kapanewon Sewon
        </p>
    </div>
</section>

<!-- KONTEN UTAMA -->
<section class="py-12 container mx-auto px-4">
    <div class="max-w-7xl mx-auto">
        <!-- Filter (Opsional) -->
        <div class="mb-8 flex items-center justify-between">
            <h2 class="text-2xl font-bold text-[var(--text-main)] font-amiri">Daftar Berita</h2>
            <!-- Anda bisa menambahkan pencarian atau filter kategori di sini -->
        </div>

        <!-- Skeleton Loading -->
        <div id="semua-berita-skeleton" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Featured Skeleton -->
            <div class="md:col-span-2 lg:col-span-2">
                <div class="rounded-2xl overflow-hidden bg-[var(--card-bg)] shadow-lg">
                    <div class="skeleton-box h-72 md:h-96 w-full"></div>
                    <div class="p-6">
                        <div class="skeleton-box h-3 w-1/4 mb-4"></div>
                        <div class="skeleton-box h-6 w-3/4 mb-2"></div>
                        <div class="skeleton-box h-6 w-2/3 mb-4"></div>
                        <div class="skeleton-box h-4 w-full mb-2"></div>
                        <div class="skeleton-box h-4 w-5/6"></div>
                    </div>
                </div>
            </div>
            <!-- Normal Skeleton -->
            <div class="bg-[var(--card-bg)] rounded-2xl overflow-hidden shadow-md">
                <div class="skeleton-box h-48 w-full"></div>
                <div class="p-5">
                    <div class="skeleton-box h-3 w-1/4 mb-3"></div>
                    <div class="skeleton-box h-5 w-3/4 mb-2"></div>
                    <div class="skeleton-box h-5 w-2/3 mb-3"></div>
                    <div class="skeleton-box h-4 w-full mb-2"></div>
                    <div class="skeleton-box h-4 w-5/6"></div>
                </div>
            </div>
        </div>

        <!-- Konten Asli (diisi oleh JS) -->
        <div id="semua-berita-list" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Diisi oleh JavaScript -->
        </div>
    </div>
</section>

<!-- SCRIPT INLINE (hanya konfirmasi, modul dipanggil via App.run) -->
<script>
    console.log('semua_berita view loaded');
</script>

<!-- STYLE INLINE (bisa dipindah ke CSS global) -->
<style>
    /* Skeleton */
    .skeleton-box {
        background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
        background-size: 200% 100%;
        animation: shimmer 1.8s infinite;
        border-radius: 0.75rem;
    }
    .dark .skeleton-box {
        background: linear-gradient(90deg, #2d3748 25%, #4a5568 50%, #2d3748 75%);
    }
    @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
    }

    /* Kartu Berita */
    .berita-card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 1rem;
        overflow: hidden;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }
    .berita-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 12px 30px rgba(0,0,0,0.1);
        border-color: var(--text-main);
    }
    .berita-card .img-wrapper {
        height: 200px;
        overflow: hidden;
        background: var(--bg-stats);
    }
    .berita-card .img-wrapper img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.5s ease;
    }
    .berita-card:hover .img-wrapper img {
        transform: scale(1.05);
    }
    .berita-card .p-5 {
        padding: 1.25rem;
    }

    /* Featured Card */
    .featured-card {
        grid-column: span 2; /* di lg */
        position: relative;
        background: var(--card-bg);
        border-radius: 1rem;
        overflow: hidden;
        box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .featured-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 12px 30px rgba(0,0,0,0.1);
    }
    .featured-card .img-wrapper {
        height: 300px;
        overflow: hidden;
    }
    .featured-card .img-wrapper img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.5s ease;
    }
    .featured-card:hover .img-wrapper img {
        transform: scale(1.05);
    }
    .featured-card .overlay {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
        color: white;
        padding: 1.5rem;
    }
    .featured-card .overlay .tag {
        background: #0f2922;
        color: white;
        padding: 0.2rem 0.6rem;
        border-radius: 9999px;
        font-size: 0.7rem;
        font-weight: 600;
        text-transform: uppercase;
    }
    .featured-card .overlay h3 {
        font-size: 1.5rem;
        line-height: 1.3;
        margin: 0.5rem 0;
    }

    /* Responsif */
    @media (max-width: 767px) {
        .featured-card {
            grid-column: span 1;
        }
        .featured-card .img-wrapper {
            height: 220px;
        }
    }

    /* Meta Info */
    .berita-meta {
        font-size: 0.8rem;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        gap: 0.75rem;
        flex-wrap: wrap;
    }
</style>
