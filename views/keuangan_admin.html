<!-- views/keuangan_admin.html -->
<!-- Halaman Admin: Manajemen Kas & Keuangan -->
<!-- Logic: js/keuangan_admin.js | Route: /keuangan_admin -->
<!-- Versi: 2.0.0 — CSS common sudah di css/style.css -->

<div id="main-content">
    <!-- ============================================================ -->
    <!-- HEADER                                                        -->
    <!-- ============================================================ -->
    <div class="flex flex-wrap justify-between items-center mb-6 gap-4">
        <h1 class="text-3xl font-bold text-[var(--text-main)] font-amiri">
            <i class="fas fa-coins mr-2"></i>
            Manajemen Kas &amp; Keuangan
        </h1>
        <div class="flex flex-wrap gap-2">
            <input type="date" id="filter-date"
                   class="px-3 py-2 border border-[var(--card-border)] rounded-lg bg-[var(--bg-body)] text-[var(--text-main)] text-sm"
                   aria-label="Filter tanggal">
            <button id="refresh-keuangan-btn"
                    class="btn-secondary px-4 py-2 rounded-lg flex items-center gap-2">
                <i class="fas fa-sync-alt"></i>
                <span class="hidden sm:inline">Refresh</span>
            </button>
            <button id="export-btn"
                    class="btn-primary px-4 py-2 rounded-lg flex items-center gap-2">
                <i class="fas fa-download"></i>
                <span class="hidden sm:inline">Export</span>
            </button>
            <button id="add-btn"
                    class="btn-primary px-4 py-2 rounded-lg flex items-center gap-2">
                <i class="fas fa-plus"></i>
                <span>Tambah Transaksi</span>
            </button>
            <button id="mobile-menu-btn"
                    class="md:hidden text-2xl text-[var(--text-muted)]"
                    aria-label="Buka Menu">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- RINGKASAN SALDO                                               -->
    <!-- ============================================================ -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
        <div class="stat-card p-4 rounded-xl bg-[var(--card-bg)] backdrop-blur-sm border border-[var(--card-border)]">
            <p class="text-xs sm:text-sm text-[var(--text-muted)] font-medium uppercase tracking-wider">
                Total Pemasukan
            </p>
            <p class="text-2xl font-bold text-green-600 mt-1" id="total-pemasukan">Rp 0</p>
        </div>
        <div class="stat-card p-4 rounded-xl bg-[var(--card-bg)] backdrop-blur-sm border border-[var(--card-border)]">
            <p class="text-xs sm:text-sm text-[var(--text-muted)] font-medium uppercase tracking-wider">
                Total Pengeluaran
            </p>
            <p class="text-2xl font-bold text-red-600 mt-1" id="total-pengeluaran">Rp 0</p>
        </div>
        <div class="stat-card p-4 rounded-xl bg-[var(--card-bg)] backdrop-blur-sm border border-[var(--card-border)]">
            <p class="text-xs sm:text-sm text-[var(--text-muted)] font-medium uppercase tracking-wider">
                Saldo Akhir
            </p>
            <p class="text-2xl font-bold text-[var(--text-main)] mt-1" id="saldo-akhir">Rp 0</p>
        </div>
    </div>

    <!-- ============================================================ -->
    <!-- TABEL TRANSAKSI                                               -->
    <!-- ============================================================ -->
    <div class="table-wrapper">
        <div class="overflow-x-auto">
            <table class="w-full">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Tanggal</th>
                        <th>Jenis</th>
                        <th>Kategori</th>
                        <th>Jumlah</th>
                        <th>Keterangan</th>
                        <th>Nota</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="table-body" class="divide-y divide-[var(--card-border)]">
                    <!-- SKELETON LOADING -->
                    <tr>
                        <td colspan="8" class="text-center py-8">
                            <i class="fas fa-spinner fa-spin text-2xl text-[var(--text-muted)]"></i>
                            <p class="text-[var(--text-muted)] text-sm mt-2">Memuat data transaksi...</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- ============================================================ -->
<!-- MODAL: TAMBAH / EDIT TRANSAKSI                                -->
<!-- ============================================================ -->
<div id="modal"
     class="fixed inset-0 bg-black/50 hidden items-center justify-center z-[9999] backdrop-blur-sm p-4">
    <div id="modal-content"
         class="bg-[var(--card-bg)] rounded-2xl shadow-2xl max-w-md w-full p-6 transform scale-95 opacity-0 transition-all duration-300 max-h-[90vh] overflow-y-auto">

        <h2 id="modal-title"
            class="text-2xl font-bold mb-4 text-[var(--text-main)] font-amiri">
            Tambah Transaksi
        </h2>

        <form id="form" class="space-y-4">
            <input type="hidden" id="edit-id">

            <div>
                <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                    Tanggal <span class="text-red-500">*</span>
                </label>
                <input type="date" id="tanggal"
                       class="form-input"
                       required>
            </div>

            <div>
                <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                    Jenis <span class="text-red-500">*</span>
                </label>
                <select id="jenis" class="form-input" required>
                    <option value="Pemasukan">Pemasukan</option>
                    <option value="Pengeluaran">Pengeluaran</option>
                </select>
            </div>

            <div>
                <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                    Kategori <span class="text-red-500">*</span>
                </label>
                <select id="kategori" class="form-input" required>
                    <option value="Iuran Anggota">Iuran Anggota</option>
                    <option value="Donasi">Donasi</option>
                    <option value="Konsumsi">Konsumsi</option>
                    <option value="Transportasi">Transportasi</option>
                    <option value="Perlengkapan">Perlengkapan</option>
                    <option value="Lainnya">Lainnya</option>
                </select>
                <input type="text" id="kategori_manual"
                       class="form-input mt-2 hidden"
                       placeholder="Masukkan kategori lainnya">
            </div>

            <div>
                <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                    Jumlah (Rp) <span class="text-red-500">*</span>
                </label>
                <input type="number" id="jumlah"
                       class="form-input"
                       placeholder="0"
                       min="0"
                       required>
            </div>

            <div>
                <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                    Keterangan
                </label>
                <textarea id="keterangan" rows="2"
                          class="form-input"
                          placeholder="Keterangan transaksi (opsional)"></textarea>
            </div>

            <div>
                <label class="block text-[var(--text-muted)] mb-2 text-sm font-medium">
                    Upload Nota <span class="text-xs font-normal">(opsional)</span>
                </label>
                <input type="file" id="nota_file"
                       class="form-input"
                       accept="image/*">
                <p class="text-xs text-[var(--text-muted)] mt-1">
                    <i class="fas fa-info-circle mr-1"></i>
                    File gambar nota akan diunggah ke Google Drive.
                </p>
                <input type="hidden" id="nota_url">
            </div>

            <div class="flex justify-end gap-2 pt-2">
                <button type="button" id="modal-close"
                        class="btn-secondary px-4 py-2 rounded-lg">
                    Batal
                </button>
                <button type="submit"
                        class="btn-primary px-4 py-2 rounded-lg">
                    <i class="fas fa-save mr-2"></i>
                    <span>Simpan</span>
                </button>
            </div>
        </form>
    </div>
</div>
