<!-- views/keuangan_admin.html -->
<!-- Halaman Admin: Manajemen Kas & Keuangan -->

<div id="main-content">
    <!-- Header -->
    <div class="flex flex-wrap justify-between items-center mb-6 gap-4">
        <h1 class="text-3xl font-bold text-[var(--text-main)] font-amiri">Manajemen Kas & Keuangan</h1>
        <div class="flex gap-2">
            <input type="date" id="filter-date" class="px-3 py-2 border rounded-lg bg-[var(--bg-body)] text-[var(--text-main)]">
            <button id="refresh-keuangan-btn" class="btn-secondary px-4 py-2 rounded-lg"><i class="fas fa-sync-alt"></i> Refresh</button>
            <button id="export-btn" class="btn-primary px-4 py-2 rounded-lg"><i class="fas fa-download"></i> Export</button>
            <button id="add-btn" class="btn-primary px-4 py-2 rounded-lg"><i class="fas fa-plus"></i> Tambah Transaksi</button>
            <button id="mobile-menu-btn" class="md:hidden text-2xl text-[var(--text-muted)]"><i class="fas fa-bars"></i></button>
        </div>
    </div>

    <!-- Ringkasan Saldo -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
        <div class="stat-card p-4 rounded-xl shadow-lg bg-[var(--card-bg)] backdrop-blur-sm border border-[var(--card-border)]">
            <p class="text-xs sm:text-sm text-[var(--text-muted)] font-medium uppercase tracking-wider">Total Pemasukan</p>
            <p class="text-2xl font-bold text-green-600 mt-1" id="total-pemasukan">Rp 0</p>
        </div>
        <div class="stat-card p-4 rounded-xl shadow-lg bg-[var(--card-bg)] backdrop-blur-sm border border-[var(--card-border)]">
            <p class="text-xs sm:text-sm text-[var(--text-muted)] font-medium uppercase tracking-wider">Total Pengeluaran</p>
            <p class="text-2xl font-bold text-red-600 mt-1" id="total-pengeluaran">Rp 0</p>
        </div>
        <div class="stat-card p-4 rounded-xl shadow-lg bg-[var(--card-bg)] backdrop-blur-sm border border-[var(--card-border)]">
            <p class="text-xs sm:text-sm text-[var(--text-muted)] font-medium uppercase tracking-wider">Saldo Akhir</p>
            <p class="text-2xl font-bold text-[var(--text-main)] mt-1" id="saldo-akhir">Rp 0</p>
        </div>
    </div>

    <!-- Tabel Transaksi -->
    <div class="bg-[var(--card-bg)] backdrop-blur-sm rounded-2xl shadow-lg border border-[var(--card-border)] overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full">
                <thead class="bg-[var(--bg-stats)]">
                    <tr>
                        <th class="px-6 py-4 text-left text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider">No</th>
                        <th class="px-6 py-4 text-left text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider">Tanggal</th>
                        <th class="px-6 py-4 text-left text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider">Jenis</th>
                        <th class="px-6 py-4 text-left text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider">Kategori</th>
                        <th class="px-6 py-4 text-left text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider">Jumlah</th>
                        <th class="px-6 py-4 text-left text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider">Keterangan</th>
                        <th class="px-6 py-4 text-left text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider">Nota</th>
                        <th class="px-6 py-4 text-left text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider">Aksi</th>
                    </tr>
                </thead>
                <tbody id="table-body" class="divide-y divide-[var(--card-border)]">
                    <!-- Akan diisi oleh JavaScript -->
                    <tr><td colspan="8" class="text-center py-4"><i class="fas fa-spinner fa-spin text-2xl"></i></td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- MODAL TAMBAH / EDIT TRANSAKSI -->
<div id="modal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 backdrop-blur-sm">
    <div class="bg-[var(--card-bg)] rounded-2xl shadow-2xl max-w-md w-full p-6 transform scale-95 opacity-0 transition-all duration-300" id="modal-content">
        <h2 class="text-2xl font-bold mb-4 text-[var(--text-main)] font-amiri" id="modal-title">Tambah Transaksi</h2>
        <form id="form" class="space-y-4">
            <input type="hidden" id="edit-id">
            <div>
                <label class="block text-[var(--text-muted)] mb-1 text-sm font-medium">Tanggal</label>
                <input type="date" id="tanggal" class="w-full px-4 py-2 border border-[var(--card-border)] rounded-lg focus:outline-none focus:border-[var(--text-main)] bg-[var(--bg-body)] text-[var(--text-main)]" required>
            </div>
            <div>
                <label class="block text-[var(--text-muted)] mb-1 text-sm font-medium">Jenis</label>
                <select id="jenis" class="w-full px-4 py-2 border border-[var(--card-border)] rounded-lg focus:outline-none focus:border-[var(--text-main)] bg-[var(--bg-body)] text-[var(--text-main)]" required>
                    <option value="Pemasukan">Pemasukan</option>
                    <option value="Pengeluaran">Pengeluaran</option>
                </select>
            </div>
            <div>
                <label class="block text-[var(--text-muted)] mb-1 text-sm font-medium">Kategori</label>
                <select id="kategori" class="w-full px-4 py-2 border border-[var(--card-border)] rounded-lg focus:outline-none focus:border-[var(--text-main)] bg-[var(--bg-body)] text-[var(--text-main)]" required>
                    <option value="Iuran Anggota">Iuran Anggota</option>
                    <option value="Donasi">Donasi</option>
                    <option value="Konsumsi">Konsumsi</option>
                    <option value="Transportasi">Transportasi</option>
                    <option value="Perlengkapan">Perlengkapan</option>
                    <option value="Lainnya">Lainnya</option>
                </select>
                <input type="text" id="kategori_manual" class="hidden mt-2 w-full px-4 py-2 border border-[var(--card-border)] rounded-lg focus:outline-none focus:border-[var(--text-main)] bg-[var(--bg-body)] text-[var(--text-main)]" placeholder="Masukkan kategori lainnya">
            </div>
            <div>
                <label class="block text-[var(--text-muted)] mb-1 text-sm font-medium">Jumlah (Rp)</label>
                <input type="number" id="jumlah" class="w-full px-4 py-2 border border-[var(--card-border)] rounded-lg focus:outline-none focus:border-[var(--text-main)] bg-[var(--bg-body)] text-[var(--text-main)]" required>
            </div>
            <div>
                <label class="block text-[var(--text-muted)] mb-1 text-sm font-medium">Keterangan</label>
                <textarea id="keterangan" rows="2" class="w-full px-4 py-2 border border-[var(--card-border)] rounded-lg focus:outline-none focus:border-[var(--text-main)] bg-[var(--bg-body)] text-[var(--text-main)]"></textarea>
            </div>
            <div>
                <label class="block text-[var(--text-muted)] mb-1 text-sm font-medium">Upload Nota (Opsional)</label>
                <input type="file" id="nota_file" accept="image/*" class="w-full px-4 py-2 border border-[var(--card-border)] rounded-lg focus:outline-none focus:border-[var(--text-main)] bg-[var(--bg-body)] text-[var(--text-main)]">
                <p class="text-xs text-[var(--text-muted)] mt-1">File gambar nota akan diunggah ke Google Drive.</p>
                <input type="hidden" id="nota_url">
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button type="button" id="modal-close" class="px-4 py-2 bg-gray-300 rounded-lg hover:bg-gray-400 text-[var(--text-main)]">Batal</button>
                <button type="submit" class="px-4 py-2 btn-primary rounded-lg hover:bg-[var(--text-main)]">Simpan</button>
            </div>
        </form>
    </div>
</div>

        background: #f1f5f9;

        border-radius: 0.5rem;
        padding: 0.5rem 1rem;
        font-weight: 500;
        transition: all 0.3s;
    }

        background: #e2e8f0;

        background: rgba(255,255,255,0.05);

        border: 1px solid rgba(128,90,213,0.4);
    }
    .dark .btn-secondary:hover {
        background: rgba(128,90,213,0.2);
        border-color: #a78bfa;
    }
    .stat-card {
        background: var(--card-bg);
        backdrop-filter: blur(8px);
        border: 1px solid var(--card-border);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .stat-card:hover {
        transform: translateY(-4px) scale(1.02);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);

    .skeleton-box {

        border-radius: 0.75rem;

        background: linear-gradient(90deg, #2d3748 25%, #4a5568 50%, #2d3748 75%);
    }
    @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
    }
</style>
